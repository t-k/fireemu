name: sdk-smoke-swift

# Manual only: one macOS runner, at most 45 wall-clock runner minutes per dispatch.
# No release gate. Cold-run estimates and measured local times are in the tool README.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-smoke-swift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apple-sdk:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      CARGO_BUILD_JOBS: '2'
      RUSTC_WRAPPER: ''
      CI: 'true'
      JAVA_TOOL_OPTIONS: -Xmx512m
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.14.0'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Check toolchain and build locked Swift package
        working-directory: tools/sdk-smoke-swift
        run: |
          xcodebuild -version
          xcrun swift --version
          xcrun swift package --cache-path .cache resolve
          git diff --exit-code -- Package.resolved
          xcrun swift build --jobs 2 --disable-automatic-resolution --cache-path .cache
          xcrun swift test --jobs 2 --disable-automatic-resolution --cache-path .cache
          python3 -m unittest test_run.py
          npm ci --ignore-scripts --cache .cache/npm
      - name: Build this commit's fireemu
        run: cargo build --locked -p fireemu
      - name: Apple SDK against fireemu
        id: fireemu
        continue-on-error: true
        working-directory: tools/sdk-smoke-swift
        run: |
          ../../target/debug/fireemu exec --project demo-app --no-config-discovery --firebase-json firebase.json --only auth,firestore,storage,database --firestore-port 0 --http-port 0 --storage-port 0 --database-port 0 --hub-port 0 --logging-port 0 --log-verbosity silent -- python3 run.py --binary .build/debug/sdk-smoke-swift --output logs/fireemu
      - name: Same Apple SDK against pinned official emulators
        id: official
        continue-on-error: true
        working-directory: tools/sdk-smoke-swift
        env:
          FIREBASE_CLI_DISABLE_UPDATE_CHECK: 'true'
        run: |
          export XDG_CONFIG_HOME="$PWD/.cache/config"
          export FIREBASE_EMULATORS_PATH="$PWD/.cache/emulators"
          export GOOGLE_APPLICATION_CREDENTIALS="$PWD/.cache/no-credentials.json"
          node_modules/.bin/firebase emulators:exec --project demo-app --config firebase.json --only auth,firestore,storage,database 'python3 run.py --binary .build/debug/sdk-smoke-swift --output logs/official' > .cache/official.log 2>&1
      - name: Publish sanitized case results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: swift-sdk-cases
          path: tools/sdk-smoke-swift/logs/
          if-no-files-found: warn
      - name: Require both complete runs
        if: always()
        env:
          FIREEMU_OUTCOME: ${{ steps.fireemu.outcome }}
          OFFICIAL_OUTCOME: ${{ steps.official.outcome }}
        run: test "$FIREEMU_OUTCOME" = success && test "$OFFICIAL_OUTCOME" = success
