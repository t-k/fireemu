name: v039 source-bound transaction binary
on:
  push:
    branches: [work/v039-quint-ci]
permissions:
  contents: read
jobs:
  txn_binary:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      RUSTC_WRAPPER: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Select immutable candidate source
        run: |
          set -euo pipefail
          git checkout --detach 11a353b8fc682a122d920098ea51ea978b422e12
          test "$(git rev-parse HEAD)" = 11a353b8fc682a122d920098ea51ea978b422e12
          test -z "$(git status --porcelain)"
          test ! -e target
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      - name: Build isolated candidate with explicit manifest
        run: |
          set -euo pipefail
          cargo build --manifest-path "$GITHUB_WORKSPACE/Cargo.toml" --locked -p fireemu --bin fireemu 2>&1 | tee "$RUNNER_TEMP/build.log"
          test -z "$(git status --porcelain)"
          mkdir "$RUNNER_TEMP/v039-txn-binary"
          cp target/debug/fireemu target/debug/fireemu.d "$RUNNER_TEMP/v039-txn-binary/"
          cp "$RUNNER_TEMP/build.log" "$RUNNER_TEMP/v039-txn-binary/"
          git rev-parse HEAD > "$RUNNER_TEMP/v039-txn-binary/source-commit.txt"
          printf '%s\n' 'cargo' 'build' '--manifest-path' "$GITHUB_WORKSPACE/Cargo.toml" '--locked' '-p' 'fireemu' '--bin' 'fireemu' > "$RUNNER_TEMP/v039-txn-binary/actual-command.txt"
          (cd "$RUNNER_TEMP/v039-txn-binary" && sha256sum fireemu fireemu.d build.log source-commit.txt actual-command.txt > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v039-txn-linux-arm64
          path: ${{ runner.temp }}/v039-txn-binary
          if-no-files-found: error
