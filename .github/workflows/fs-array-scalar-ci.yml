name: fs-array-scalar-ci
on:
  push:
    branches: [work/fs-array-scalar-ci]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: b434a2edc24b9dd62f996f803196b4ed70e5aedb
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177
        with:
          tool: cargo-nextest@0.9.143
      - run: |
          test "$(git rev-parse HEAD)" = b434a2edc24b9dd62f996f803196b4ed70e5aedb
          cargo nextest run -p fireemu-core-firestore -p fireemu-adapter-grpc --profile pr --locked --no-fail-fast -E 'test(current_document_returns_fields_and_document_metadata) | test(recorded_arity_metadata_formats_document_and_comparison_signatures) | test(generated_comparison_arity_and_precedence_cases) | test(where_is_type_keeps_static_type_validation) | test(valid_where_equal_retains_field_filter_pushdown) | test(recorded_tagged_literals_preserve_wire_shapes) | test(vector_in_array_preserves_dimension_order) | test(the_pipeline_corpus_replays_as_production_answered) | test(the_differential_corpus_holds_both_profiles_to_their_rules) | test(strict_answers_recorded_arity_and_refuses_unobserved_shapes) | test(observed_internal_fixtures_and_pict_cases)'
