name: functions-sdk-discovery

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/functions-sdk-discovery.yml
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - crates/fireemu/Cargo.toml
      - crates/fireemu/src/main.rs
      - crates/fireemu/src/config.rs
      - crates/fireemu/src/config_discovery.rs
      - crates/fireemu/src/daemon.rs
      - crates/fireemu/src/functions*.rs
      - crates/fireemu/tests/functions_discovery.rs
      - crates/fireemu/tests/functions_codebases.rs
      - crates/fireemu/tests/functions_environment.rs
      - crates/fireemu/tests/functions_admin_app_check.rs
      - crates/fireemu/tests/functions_runtime_selection.rs
      - crates/fireemu/tests/census/**
      - crates/fireemu-adapter-functions/**
      - crates/fireemu-adapter-http/src/identity_toolkit.rs
      - crates/fireemu-core-functions/**
      - tools/runner-node/**
      - tools/sdk-smoke/**
      - npm/fireemu/testing.mjs
      - conformance/package.json
      - conformance/pnpm-lock.yaml
      - conformance/src/auth-tenant-blocking/function/package.json
  push:
    branches: [main]
    paths:
      - .github/workflows/functions-sdk-discovery.yml
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - crates/fireemu/Cargo.toml
      - crates/fireemu/src/main.rs
      - crates/fireemu/src/config.rs
      - crates/fireemu/src/config_discovery.rs
      - crates/fireemu/src/daemon.rs
      - crates/fireemu/src/functions*.rs
      - crates/fireemu/tests/functions_discovery.rs
      - crates/fireemu/tests/functions_codebases.rs
      - crates/fireemu/tests/functions_environment.rs
      - crates/fireemu/tests/functions_admin_app_check.rs
      - crates/fireemu/tests/functions_runtime_selection.rs
      - crates/fireemu/tests/census/**
      - crates/fireemu-adapter-functions/**
      - crates/fireemu-adapter-http/src/identity_toolkit.rs
      - crates/fireemu-core-functions/**
      - tools/runner-node/**
      - tools/sdk-smoke/**
      - npm/fireemu/testing.mjs
      - conformance/package.json
      - conformance/pnpm-lock.yaml
      - conformance/src/auth-tenant-blocking/function/package.json
  schedule:
    - cron: '0 3 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  real-sdk-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tools/sdk-smoke/package-lock.json
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: functions-sdk-discovery
      # The runner Node tests load the pinned real firebase-functions SDK from the conformance
      # install, as ci.yml's runner-node job provides it.
      - name: install the pinned real SDK for the runner tests
        run: pnpm -C conformance install --frozen-lockfile
      - name: install the real Functions SDK fixture
        run: npm ci --prefix tools/sdk-smoke --ignore-scripts
      - name: run every real SDK discovery scenario
        run: cargo test -p fireemu --test functions_discovery -- --ignored --test-threads=1
      - name: run every real SDK multi-codebase scenario
        run: cargo test -p fireemu --test functions_codebases -- --ignored --test-threads=1
      - name: verify Functions environment, routing, secret isolation and reload
        run: cargo test -p fireemu --test functions_environment -- --include-ignored
      - name: verify Admin SDK App Check verification in HTTP functions
        run: cargo test -p fireemu --test functions_admin_app_check -- --ignored --test-threads=1
      - name: verify Node runtime selection with the installed loader
        run: cargo test -p fireemu --test functions_runtime_selection
      - name: verify runner trust boundaries and log attribution
        run: node --test tools/runner-node/*.test.mjs
