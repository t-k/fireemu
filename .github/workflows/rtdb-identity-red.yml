name: rtdb-identity-red
on:
  push:
    branches: [work/rtdb-rules-identity-ci]
permissions:
  contents: read
jobs:
  red:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 05b36285788732760c4f5b35ed5089160dae016d
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      - name: Confirm regression fails under capped build
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 05b36285788732760c4f5b35ed5089160dae016d
          mkdir /tmp/rtdb-red
          git rev-parse HEAD > /tmp/rtdb-red/source.txt
          set +e
          sudo systemd-run --scope --quiet -p MemoryMax=6G -p MemorySwapMax=0 --uid "$(id -u)" --gid "$(id -g)" env PATH="$PATH" HOME="$HOME" sh -c 'cgroup=$(awk -F: '\''$1 == "0" {print $3}'\'' /proc/self/cgroup); cat "/sys/fs/cgroup$cgroup/memory.max" "/sys/fs/cgroup$cgroup/memory.swap.max" > /tmp/rtdb-red/cgroup.txt; test "$(cat "/sys/fs/cgroup$cgroup/memory.max")" = 6442450944; test "$(cat "/sys/fs/cgroup$cgroup/memory.swap.max")" = 0; exec cargo test -p fireemu-core-database --test rules auth_root_identity_matches_the_recorded_read --locked -j 2' > /tmp/rtdb-red/output.txt 2>&1
          status=$?
          set -e
          echo "$status" > /tmp/rtdb-red/status.txt
          test "$status" = 101
          grep -F 'assertion failed: rules.can_read' /tmp/rtdb-red/output.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rtdb-identity-red
          path: /tmp/rtdb-red/
