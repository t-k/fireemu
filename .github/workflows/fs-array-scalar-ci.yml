name: fs-array-scalar-ci
on:
  push:
    branches: [work/fs-array-scalar-ci]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: b6696d29a4811a3435a71dfc9c4ebb02b3535644
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177
        with:
          tool: cargo-nextest@0.9.143
      - run: |
          test "$(git rev-parse HEAD)" = b6696d29a4811a3435a71dfc9c4ebb02b3535644
          cargo nextest run -p fireemu-adapter-grpc --profile pr --locked -E 'test(recorded_infinite_vectors_and_documents_root_preserve_types) | test(vector_in_array_keeps_unobserved_components_refused) | test(strict_refuses_references_outside_or_too_deep) | test(recorded_tagged_literals_preserve_wire_shapes) | test(vector_dimension_limit_and_nan_components_reject_the_whole_commit) | test(resource_names_round_trip_and_non_document_names_are_rejected)'
