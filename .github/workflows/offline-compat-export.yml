name: v041 build and R21 private candidate
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Final full source commit SHA
        required: true
        type: string
      version:
        description: Expected workspace version
        required: true
        default: 0.41.0
        type: string
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      binary_sha: ${{ steps.custody.outputs.binary_sha }}
    env:
      EXPECTED_SOURCE: ${{ inputs.source_sha }}
      EXPECTED_VERSION: ${{ inputs.version }}
      RUSTC_WRAPPER: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.32.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.14.0
      - run: pnpm -C ui install --frozen-lockfile && pnpm -C ui build
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.94.0
          targets: x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Materialize reviewed driver
        run: echo  | base64 -d > "$RUNNER_TEMP/build-r21-driver.sh"
      - name: Build source-bound binary under memory cap
        id: custody
        env:
          CUSTODY: ${{ runner.temp }}/v041-custody
        shell: bash
        run: |
          mkdir -p "$CUSTODY"
          sudo systemd-run --scope --quiet -p MemoryMax=6442450944 -p MemorySwapMax=0 \
            setpriv --reuid="$(id -u)" --regid="$(id -g)" --init-groups -- env PATH="$PATH" HOME="$HOME" RUNNER_TEMP="$RUNNER_TEMP" CUSTODY="$CUSTODY" EXPECTED_SOURCE="$EXPECTED_SOURCE" EXPECTED_VERSION="$EXPECTED_VERSION" RUSTC_WRAPPER= \
            bash "$RUNNER_TEMP/build-r21-driver.sh" build
          echo "binary_sha=$(cat "$CUSTODY/binary.sha")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v041-build-custody
          path: ${{ runner.temp }}/v041-custody
          if-no-files-found: error
  r21:
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      EXPECTED_SOURCE: ${{ inputs.source_sha }}
      EXPECTED_VERSION: ${{ inputs.version }}
      EXPECTED_BINARY_SHA: ${{ needs.build.outputs.binary_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: v041-build-custody
          path: ${{ runner.temp }}/v041-custody
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.32.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.14.0
      - run: pnpm -C conformance install --frozen-lockfile
      - name: Materialize reviewed driver
        run: echo  | base64 -d > "$RUNNER_TEMP/build-r21-driver.sh"
      - name: Replay full R21 in capped isolated namespace
        env:
          CUSTODY: ${{ runner.temp }}/v041-custody
          OUT: ${{ runner.temp }}/v041-r21
        shell: bash
        run: |
          chmod +x "$CUSTODY/fireemu"
          mkdir -p "$OUT"
          sudo systemd-run --scope --quiet -p MemoryMax=6442450944 -p MemorySwapMax=0 \
            unshare --net --pid --fork --mount-proc --kill-child -- \
            sh -c 'ip link set lo up; exec setpriv --reuid="$1" --regid="$2" --init-groups -- env PATH="$3" HOME="$4" EXPECTED_SOURCE="$5" EXPECTED_VERSION="$6" EXPECTED_BINARY_SHA="$7" CUSTODY="$8" FIREEMU_BIN="$8/fireemu" OUT="$9" bash "${10}" r21' \
            sh "$(id -u)" "$(id -g)" "$PATH" "$HOME" "$EXPECTED_SOURCE" "$EXPECTED_VERSION" "$EXPECTED_BINARY_SHA" "$CUSTODY" "$OUT" "$RUNNER_TEMP/build-r21-driver.sh"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v041-r21-raw
          path: |
            ${{ runner.temp }}/v041-r21
            conformance/.runs/fs-ent-pipeline/fireemu.json
            conformance/.runs/fs-ent-pipeline/comparison.json
          if-no-files-found: warn
