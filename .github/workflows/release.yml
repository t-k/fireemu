name: release

# A release is cut by pushing a `v*` tag. Everything the tag produces -- the binaries, the
# platform packages, the archives, the checksums and the npm publish -- comes from that one
# commit, and the version is stamped from the tag rather than read from a file, so nothing in
# the tree can disagree with what was published.
#
# `workflow_dispatch` runs the same jobs end to end without publishing anything: it builds
# every platform, assembles and packs every package, and uploads the artifacts, so the
# packaging can be exercised on a branch before a tag exists.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp for the dry run (no tag is created, nothing is published)"
        required: false
        default: "0.0.0-dev"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Reproducibility inputs. The compiler is pinned by rust-toolchain.toml; the two paths a
  # build would otherwise embed (the checkout and the cargo home) are remapped to fixed names,
  # so the same commit built in another directory, or by another machine, yields the same
  # bytes. The `reproducible` job below builds linux-x64 twice under different paths and
  # compares them.
  RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=/src --remap-path-prefix=/home/runner/.cargo=/cargo -D warnings
  SOURCE_DATE_EPOCH: 0

jobs:
  # The single source of truth for what gets built is npm/platforms/platforms.mjs; the matrix
  # is read out of it rather than repeated here.
  plan:
    runs-on: ubuntu-latest
    outputs:
      platforms: ${{ steps.matrix.outputs.platforms }}
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - id: matrix
        run: echo "platforms=$(node npm/scripts/matrix.mjs)" >> "$GITHUB_OUTPUT"
      - id: version
        # A tag publishes; a manual run never does, whatever version it was given. The version
        # is only stripped of its `v` here -- `stamp-version.mjs` is what rejects a tag that is
        # not a release version, and it does that in the job that writes the manifests.
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT" = "push" ]; then
            version="${GITHUB_REF_NAME#v}"
            publish=true
          else
            version="${INPUT_VERSION:-0.0.0-dev}"
            publish=false
          fi
          node npm/scripts/stamp-version.mjs "$version" --print
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "publish=${publish}" >> "$GITHUB_OUTPUT"
          echo "releasing ${version} (publish: ${publish})"

  # The Emulator UI is built once and reused by every platform, so every binary in a release
  # embeds byte-identical assets.
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 10.32.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm -C ui install --frozen-lockfile
      - run: pnpm -C ui build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ui-dist
          path: ui/dist
          if-no-files-found: error
          retention-days: 1

  test:
    needs: [ui]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ui-dist
          path: ui/dist
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.94.0
      - uses: taiki-e/install-action@7b8d4719ee4aaa279bdf55df38dacb9ebfe12a6c
        with:
          tool: cargo-nextest
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
        with:
          key: release-test
      - run: cargo nextest run --workspace --profile pr

  build:
    needs: [plan, ui, test]
    strategy:
      fail-fast: true
      matrix:
        platform: ${{ fromJSON(needs.plan.outputs.platforms) }}
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ui-dist
          path: ui/dist
      - name: the UI bundle arrived
        shell: bash
        run: test -f ui/dist/index.html

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.94.0
          targets: ${{ matrix.platform.target }}
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
        with:
          key: ${{ matrix.platform.target }}

      # musl needs its own C toolchain for the linkers Rust invokes.
      - name: musl toolchain
        if: contains(matrix.platform.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: build the daemon
        run: cargo build --release --locked -p fireemu --target ${{ matrix.platform.target }}

      - name: the UI is embedded in the artifact
        shell: bash
        # `doctor` reports what the binary actually carries. A cross-compiled artifact cannot
        # be run here, so it is checked on the host that can.
        run: |
          if [ "${{ matrix.platform.cross }}" = "true" ]; then
            echo "cross-compiled: checked on the host build of the same commit"
          else
            ./target/${{ matrix.platform.target }}/release/fireemu${{ matrix.platform.exe }} doctor
          fi

      - name: assemble the platform package
        shell: bash
        run: |
          node npm/platforms/build-platform.mjs \
            --platform ${{ matrix.platform.name }} \
            --binary target/${{ matrix.platform.target }}/release/fireemu${{ matrix.platform.exe }} \
            --out npm/platforms/build/${{ matrix.platform.name }} \
            --version ${{ needs.plan.outputs.version }}

      # The archive attached to the GitHub Release is the same tree as the npm package, so a
      # user who does not want npm gets exactly what npm would have installed.
      - name: archive
        shell: bash
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          NAME: ${{ matrix.platform.name }}
        run: |
          mkdir -p dist
          base="fireemu-${VERSION}-${NAME}"
          if [ "${{ matrix.platform.os }}" = "win32" ]; then
            (cd npm/platforms/build && 7z a -tzip "../../../dist/${base}.zip" "${NAME}") >/dev/null
          else
            # Deterministic: a fixed member order, owner and mtime, and no gzip timestamp,
            # so the archive of a reproducible binary is itself reproducible.
            tar --sort=name --owner=0 --group=0 --numeric-owner --mtime="@${SOURCE_DATE_EPOCH}" \
              -C npm/platforms/build -cf - "${NAME}" | gzip -n > "dist/${base}.tar.gz"
          fi
          ls -l dist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: package-${{ matrix.platform.name }}
          path: npm/platforms/build/${{ matrix.platform.name }}
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: archive-${{ matrix.platform.name }}
          path: dist/*
          if-no-files-found: error

  # The same commit, built twice under different directories, has to produce the same bytes.
  # Only linux-x64 is checked: it is the platform every CI container installs, and the other
  # targets are built with the same flags on the same pinned compiler. The verdict is printed
  # and does not yet block a release; once it has passed on a tag, drop continue-on-error.
  reproducible:
    needs: [plan, ui]
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ui-dist
          path: ui/dist
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: rustup target add x86_64-unknown-linux-musl
      - name: first build, in the checkout
        run: |
          cargo build --release --locked -p fireemu --target x86_64-unknown-linux-musl
          sha256sum target/x86_64-unknown-linux-musl/release/fireemu | tee first.sha256
      - name: second build, from a copy under another path
        env:
          RUSTFLAGS: --remap-path-prefix=/tmp/fireemu-rebuild=/src --remap-path-prefix=/home/runner/.cargo=/cargo -D warnings
        run: |
          rsync -a --exclude target --exclude .git ./ /tmp/fireemu-rebuild/
          cd /tmp/fireemu-rebuild
          cargo build --release --locked -p fireemu --target x86_64-unknown-linux-musl
          sha256sum target/x86_64-unknown-linux-musl/release/fireemu | awk '{print $1}' > "$GITHUB_WORKSPACE/second.sha256"
      - name: the two builds are byte-identical
        run: |
          first=$(awk '{print $1}' first.sha256); second=$(cat second.sha256)
          echo "first  $first"; echo "second $second"
          test "$first" = "$second"

  # The artifact a user installs, not the workspace build, is what the conformance corpus is
  # replayed against: the packed launcher and the linux-x64 package are installed offline into
  # a project the way `npm install fireemu` would, run through doctor / exec / symlink /
  # read-only checks, and then drive `pnpm -C conformance run check`. The npm SBOM of that
  # installation is attached to the release next to the cargo one.
  verify-artifact:
    needs: [plan, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 10.32.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: package-linux-x64
          path: npm/platforms/build/linux-x64
      - name: pack the two packages at the release version
        run: |
          node npm/scripts/stamp-version.mjs ${{ needs.plan.outputs.version }}
          node npm/scripts/prepare-launcher.mjs
          mkdir -p npm/dist
          (cd npm/platforms/build/linux-x64 && npm pack --pack-destination ../../../dist)
          (cd npm/fireemu && npm pack --pack-destination ../dist)
          ls -l npm/dist
      - name: install and run it the way a user would
        id: install
        run: |
          node npm/scripts/verify-install.mjs --dist npm/dist --keep | tee verify.log
          echo "dir=$(grep '^install=' verify.log | cut -d= -f2-)" >> "$GITHUB_OUTPUT"
      - name: the npm SBOM of the installation
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          mkdir -p sbom
          (cd "${{ steps.install.outputs.dir }}" && npm sbom --sbom-format cyclonedx --omit dev) \
            > "sbom/fireemu-${VERSION}.npm.cdx.json"
          node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))' "sbom/fireemu-${VERSION}.npm.cdx.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sbom-npm
          path: sbom/*
          if-no-files-found: error
      - name: the conformance corpus against the installed binary
        env:
          FIREEMU_BIN: ${{ steps.install.outputs.dir }}/node_modules/@fireemu/linux-x64/bin/fireemu
        run: |
          pnpm -C conformance install --frozen-lockfile
          test -x "$FIREEMU_BIN"
          pnpm -C conformance run check

  publish:
    needs: [plan, build, verify-artifact]
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: write # create the release and attach its assets
      id-token: write # npm publish --provenance, and build attestations
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: install the Trusted Publishing capable npm CLI
        run: npm install --global npm@11.9.0

      - name: collect the platform packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: package-*
          path: npm/platforms/build
      - name: collect the archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: archive-*
          path: dist
          merge-multiple: true

      - name: the download layout is what the scripts expect
        run: |
          # download-artifact writes `<path>/package-<name>/...`; the scripts want `<name>/`.
          cd npm/platforms/build
          for dir in package-*; do mv "$dir" "${dir#package-}"; done
          find . -maxdepth 2 -print | sort | head -50

      - name: stamp the version
        run: node npm/scripts/stamp-version.mjs ${{ needs.plan.outputs.version }}
      - name: prepare the launcher package
        run: node npm/scripts/prepare-launcher.mjs

      # Software bills of materials: the Rust dependency graph of the daemon (CycloneDX from
      # Cargo.lock, licences included) and the npm tree of an installation (from
      # verify-artifact). Both are release assets and both are in SHA256SUMS.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
      - uses: taiki-e/install-action@7b8d4719ee4aaa279bdf55df38dacb9ebfe12a6c
        with:
          tool: cargo-cyclonedx
      - name: the cargo SBOM
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          cargo cyclonedx --manifest-path crates/fireemu/Cargo.toml --format json --all
          mv crates/fireemu/*.cdx.json "dist/fireemu-${VERSION}.cargo.cdx.json"
      - name: collect the npm SBOM
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: sbom-npm
          path: dist

      - name: checksums
        run: |
          cd dist
          sha256sum fireemu-* > SHA256SUMS
          cat SHA256SUMS

      # Provenance for the archives is a release gate. A tag must not publish packages when the
      # corresponding GitHub attestation cannot be created.
      - name: build provenance
        id: attest
        if: needs.plan.outputs.publish == 'true'
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45
        with:
          subject-path: "dist/fireemu-*"
      - name: provenance outcome
        if: needs.plan.outputs.publish == 'true'
        run: echo "build provenance attestation - ${{ steps.attest.outcome }}"

      # Platform packages first: `fireemu` pins them exactly, so publishing the launcher before
      # them would leave a version on the registry that cannot be installed.
      - name: publish the platform packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PUBLISH: ${{ needs.plan.outputs.publish }}
        run: |
          for dir in npm/platforms/build/*/; do
            if [ "$PUBLISH" = "true" ]; then
              npm publish "$dir" --provenance --access public
            else
              npm publish "$dir" --dry-run --access public
            fi
          done
      - name: publish the launcher
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PUBLISH: ${{ needs.plan.outputs.publish }}
        run: |
          if [ "$PUBLISH" = "true" ]; then
            npm publish npm/fireemu --provenance --access public
          else
            npm publish npm/fireemu --dry-run --access public
          fi

      - name: the GitHub Release
        if: needs.plan.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/*

      - name: the dry run's artifacts
        if: needs.plan.outputs.publish != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dry-run-archives
          path: dist/*
          if-no-files-found: error
