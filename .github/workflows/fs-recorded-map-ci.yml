name: fs-recorded-map-ci
on:
  push:
    branches: [work/fs-recorded-map-ci]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: c610fe6ebdf95521afa73b19c69ea787f82aa0fb
          fetch-depth: 0
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177
        with:
          tool: cargo-nextest@0.9.143
      - name: Run affected crates
        run: |
          test "$(git rev-parse HEAD)" = c610fe6ebdf95521afa73b19c69ea787f82aa0fb
          cargo nextest run -p fireemu-core-firestore -p fireemu-adapter-grpc --profile pr --locked --no-fail-fast
      - name: Clippy affected crates
        if: always()
        run: cargo clippy -p fireemu-core-firestore -p fireemu-adapter-grpc --all-targets --locked -- -D warnings
