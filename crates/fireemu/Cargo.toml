[package]
name = "fireemu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "An experimental local runtime for testing Firebase SDK and Functions code"

[[bin]]
name = "fireemu"
path = "src/main.rs"

[dependencies]
fireemu-adapter-support = { path = "../fireemu-adapter-support" }
fireemu-core-types = { path = "../fireemu-core-types" }
fireemu-core-limits = { path = "../fireemu-core-limits" }
fireemu-core-session = { path = "../fireemu-core-session" }
fireemu-core-firestore = { path = "../fireemu-core-firestore" }
fireemu-core-rules = { path = "../fireemu-core-rules" }
fireemu-core-storage = { path = "../fireemu-core-storage" }
fireemu-core-auth = { path = "../fireemu-core-auth" }
fireemu-core-app-check = { path = "../fireemu-core-app-check" }
fireemu-proto-firestore = { path = "../fireemu-proto-firestore" }
fireemu-adapter-grpc = { path = "../fireemu-adapter-grpc" }
fireemu-adapter-http = { path = "../fireemu-adapter-http" }
fireemu-adapter-functions = { path = "../fireemu-adapter-functions" }
fireemu-adapter-pubsub = { path = "../fireemu-adapter-pubsub" }
fireemu-adapter-logging = { path = "../fireemu-adapter-logging" }
fireemu-adapter-ui = { path = "../fireemu-adapter-ui" }
fireemu-core-functions = { path = "../fireemu-core-functions" }
fireemu-core-pubsub = { path = "../fireemu-core-pubsub" }
fireemu-core-export = { path = "../fireemu-core-export" }
fireemu-export-publication = { path = "../fireemu-export-publication" }
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "signal", "sync", "time"] }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
libc = "0.2"
rustix = { version = "1", features = ["fs", "process"] }
zeroize = "1"

[target.'cfg(target_os = "macos")'.dependencies]
exacl = "0.13"

[target.'cfg(windows)'.dependencies]
process-wrap = { version = "8.2.1", default-features = false, features = ["job-object", "kill-on-drop", "tokio1"] }

[lints]
workspace = true
