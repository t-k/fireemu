name: Temporary Storage PUT mutations
on:
  pull_request:
permissions:
  contents: read
jobs:
  mutations:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: assert exact head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git rev-parse HEAD
          sha256sum crates/fireemu-adapter-http/src/storage.rs crates/fireemu-adapter-http/tests/storage.rs
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177
        with:
          tool: cargo-nextest@0.9.143
      - name: baseline and scoped mutations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mutation-logs
          cargo nextest run -p fireemu-adapter-http --test storage -E 'test(signed_xml_put)' > mutation-logs/baseline.txt 2>&1
          cargo nextest run -p fireemu-adapter-http --test storage -E 'test(signed_xml_put)' > mutation-logs/no-op.txt 2>&1
          python3 -c "from pathlib import Path; p=Path('crates/fireemu-adapter-http/tests/storage.rs'); s=p.read_text(); a='from_unix_seconds(1_788_004_860)'; assert s.count(a)==1; p.write_text(s.replace(a, 'from_unix_seconds(1_788_006_660)'))"
          cargo nextest run -p fireemu-adapter-http --test storage -E 'test(signed_xml_put)' > mutation-logs/aged-no-op.txt 2>&1
          git restore crates/fireemu-adapter-http/tests/storage.rs
          python3 -c "from pathlib import Path; p=Path('crates/fireemu-adapter-http/src/storage.rs'); s=p.read_text(); i=s.index('fn xml_style_put('); a=s[:i]; b=s[i:]; x='SignedUrl::Expired => {'; y='SignedUrl::Invalid(details) => {'; assert b.count(x)==1 and b.count(y)==1; b=b.replace(x,'SignedUrl::Expired if false => {',1).replace(y,'SignedUrl::Expired => {}\n        '+y,1); p.write_text(a+b)"
          if cargo nextest run -p fireemu-adapter-http --test storage -E 'test(signed_xml_put)' > mutation-logs/accept-expired.txt 2>&1; then exit 1; fi
          grep -q 'assertion' mutation-logs/accept-expired.txt
          git restore crates/fireemu-adapter-http/src/storage.rs
          python3 -c "from pathlib import Path; p=Path('crates/fireemu-adapter-http/src/storage.rs'); s=p.read_text(); i=s.index('fn xml_style_put('); a=s[:i]; b=s[i:]; x='SignedUrl::Absent if state.is_strict()'; assert b.count(x)==1; p.write_text(a+b.replace(x,'SignedUrl::Absent if false && state.is_strict()',1))"
          if cargo nextest run -p fireemu-adapter-http --test storage -E 'test(signed_xml_put)' > mutation-logs/accept-unsigned.txt 2>&1; then exit 1; fi
          grep -q 'assertion' mutation-logs/accept-unsigned.txt
          git restore crates/fireemu-adapter-http/src/storage.rs
          python3 -c "from pathlib import Path; p=Path('crates/fireemu-adapter-http/src/storage.rs'); s=p.read_text(); i=s.index('fn xml_style_put('); a=s[:i]; b=s[i:]; x='if !valid {'; assert b.count(x)==1; p.write_text(a+b.replace(x,'if valid && req.body.is_empty() {',1))"
          if cargo nextest run -p fireemu-adapter-http --test storage -E 'test(signed_xml_put)' > mutation-logs/accept-invalid-range.txt 2>&1; then exit 1; fi
          grep -q 'assertion' mutation-logs/accept-invalid-range.txt
          git restore crates/fireemu-adapter-http/src/storage.rs
      - name: upload mutation logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: storage-put-extra-mutations
          path: mutation-logs/
          if-no-files-found: error
