name: rtdb-identity-before
on:
  push:
    branches: [work/rtdb-rules-identity-ci]
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 072d5329bb140f4737d93057c94063df651cc3a0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: .ci-helper
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      - name: Build exact source under memory cap
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 072d5329bb140f4737d93057c94063df651cc3a0
          mkdir /tmp/rtdb-before
          sudo systemd-run --scope --quiet -p MemoryMax=6G -p MemorySwapMax=0 --uid "$(id -u)" --gid "$(id -g)" env PATH="$PATH" HOME="$HOME" sh -c 'cgroup=$(awk -F: '"'"'$1 == "0" {print $3}'"'"' /proc/self/cgroup); cat "/sys/fs/cgroup$cgroup/memory.max" "/sys/fs/cgroup$cgroup/memory.swap.max" > /tmp/rtdb-before/cgroup.txt; test "$(cat "/sys/fs/cgroup$cgroup/memory.max")" = 6442450944; test "$(cat "/sys/fs/cgroup$cgroup/memory.swap.max")" = 0; exec cargo build -p fireemu --locked -j 2'
          git rev-parse HEAD > /tmp/rtdb-before/source.txt
          sha256sum target/debug/fireemu > /tmp/rtdb-before/binary.sha256
          for profile in strict emulator; do
            printf '{"schemaVersion":1,"profile":"%s"}\n' "$profile" > "/tmp/$profile.json"
            sudo unshare --net -- sh -c 'ip link set lo up; exec setpriv --reuid="$1" --regid="$2" --init-groups -- env -u GOOGLE_APPLICATION_CREDENTIALS "$3" exec --config "$4" --no-config-discovery --project demo-test --only database --database-port 0 --ui-port 0 --hub-port 0 --logging-port 0 -- node "$5" "$6"' sh "$(id -u)" "$(id -g)" "$PWD/target/debug/fireemu" "/tmp/$profile.json" "$PWD/.ci-helper/.github/temporary/rtdb_identity_before.mjs" "/tmp/rtdb-before/$profile.json" > "/tmp/rtdb-before/$profile.log" 2>&1
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rtdb-identity-before
          path: /tmp/rtdb-before/
