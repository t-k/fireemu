name: fs-document-expressions-ci
on:
  push:
    branches: [work/fs-document-expressions-ci]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 7d52a57e61c15dc7633274a68e04b537d0db92ba
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177
        with:
          tool: cargo-nextest@0.9.143
      - run: |
          test "$(git rev-parse HEAD)" = 7d52a57e61c15dc7633274a68e04b537d0db92ba
          cargo fmt --all -- --check
          cargo nextest run -p fireemu-core-firestore -p fireemu-adapter-grpc --profile pr --locked
          cargo clippy -p fireemu-core-firestore -p fireemu-adapter-grpc --all-targets --all-features --locked -- -D warnings
      - name: adapter mutation check
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p fireemu-adapter-grpc --test pipeline_differential the_differential_corpus_holds_both_profiles_to_their_rules --locked
          python3 -c 'import pathlib; p=pathlib.Path("crates/fireemu-adapter-grpc/src/pipeline.rs"); s=p.read_text(); a="function.name == \"current_document\" || args.iter().any(reads_field)"; b="function.name == \"unrelated\" || args.iter().any(reads_field)"; assert s.count(a)==1; p.write_text(s.replace(a,b,1))'
          set +e
          cargo test -p fireemu-adapter-grpc --test pipeline_differential the_differential_corpus_holds_both_profiles_to_their_rules --locked > adapter-mutation.log 2>&1
          rc=$?
          set -e
          cat adapter-mutation.log
          test "$rc" = 101
          grep -q 'the_differential_corpus_holds_both_profiles_to_their_rules ... FAILED' adapter-mutation.log
          git checkout -- crates/fireemu-adapter-grpc/src/pipeline.rs
