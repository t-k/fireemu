name: pages

# Publishes the project site in site/ to GitHub Pages. The configuration schemas under
# spec/config are published next to it, so the "$schema" URLs in fireemu.json resolve once
# the site is served from its domain.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "spec/config/*.schema.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Assemble the site
        run: |
          mkdir -p _site/spec/config
          cp -R site/. _site/
          cp spec/config/fireemu.schema.json spec/config/firebase-json.schema.json _site/spec/config/
          touch _site/.nojekyll
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
