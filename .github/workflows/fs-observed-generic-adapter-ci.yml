name: fs-observed-generic-adapter-ci
on:
  push:
    branches: [work/fs-observed-generic-adapter-ci]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 4f8d60a7bd085b21cf6ddec11a6acb583ada8fb0
          fetch-depth: 0
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177
        with:
          tool: cargo-nextest@0.9.143
      - run: |
          test "$(git rev-parse HEAD)" = 4f8d60a7bd085b21cf6ddec11a6acb583ada8fb0
          cargo nextest run -p fireemu-adapter-grpc --profile pr --locked --no-fail-fast -E 'test(autogen_document_id_uses_request_runtime) | test(coalesce_skips_failing_constant_but_validates_static_errors)'
