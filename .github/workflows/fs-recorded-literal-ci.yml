name: fs-recorded-literal-ci
on:
  push:
    branches: [work/fs-recorded-literal-ci]
permissions:
  contents: read
jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 28cd5c44eacdee151035e776f648d6e4db661dc2
          fetch-depth: 0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: .ci-helper
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177
        with:
          tool: cargo-nextest@0.9.143
      - name: Verify exact source and run mutations
        run: |
          test "$(git rev-parse HEAD)" = 28cd5c44eacdee151035e776f648d6e4db661dc2
          test "$(git -C .ci-helper rev-parse HEAD)" = "$GITHUB_SHA"
          python3 .ci-helper/.github/temporary/literal_mutations.py
      - name: Preserve mutation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: recorded-literal-mutations
          path: /tmp/literal-mutants/
          if-no-files-found: warn
