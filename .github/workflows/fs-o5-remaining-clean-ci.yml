name: fs-o5-remaining-clean-ci
on:
  push:
    branches: [work/fs-o5-remaining-clean-ci]
permissions:
  contents: read
jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 5bddc78300d82b10cd3cfa84c9966f6b688eb0ff
          fetch-depth: 0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: .ci-helper
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177
        with:
          tool: cargo-nextest@0.9.143
      - run: |
          test "$(git rev-parse HEAD)" = 5bddc78300d82b10cd3cfa84c9966f6b688eb0ff
          test "$(git -C .ci-helper rev-parse HEAD)" = "$GITHUB_SHA"
          sudo systemd-run --scope -p MemoryMax=6G -p MemorySwapMax=0 --uid="$(id -u)" --gid="$(id -g)" env PATH="$PATH" HOME="$HOME" python3 .ci-helper/.github/temporary/remaining_mutations.py
      - name: Preserve mutation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: o5-remaining-clean-mutations
          path: /tmp/o5-remaining-mutants/
          if-no-files-found: warn
