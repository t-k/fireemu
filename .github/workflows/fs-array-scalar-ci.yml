name: fs-array-scalar-ci
on:
  push:
    branches: [work/fs-array-scalar-ci]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ede61810e570f9545a5e04445cc044e635a1e043
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177
        with:
          tool: cargo-nextest@0.9.143
      - run: |
          test "$(git rev-parse HEAD)" = ede61810e570f9545a5e04445cc044e635a1e043
          cargo nextest run -p fireemu-core-firestore -p fireemu-adapter-grpc --profile pr --locked
      - name: Clippy changed crates
        if: always()
        run: cargo clippy -p fireemu-core-firestore -p fireemu-adapter-grpc --all-targets --locked -- -D warnings
