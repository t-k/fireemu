[graph]
all-features = true

[advisories]
version = 2
ignore = [
    # RUSTSEC-2023-0071 (Marvin attack, a timing side channel in RSA PKCS#1 v1.5 decryption).
    # fireemu uses `rsa` only to sign and verify its own local RS256 session tokens on a
    # loopback test runtime; no RSA decryption path exists and no upstream fix is published.
    # Revisit when `rsa` ships a constant-time release.
    { id = "RUSTSEC-2023-0071", reason = "rsa is used for local RS256 signatures only; no decryption oracle is exposed and no fixed release exists" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    # MIT-0 (MIT No Attribution): fluent-uri via jsonschema, dev tool only.
    "MIT-0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
