# Repository-level defaults for the compat-broad suites.
#
# `timeout` and `timeout_method` are read by pytest-timeout. That plugin is not
# a CI dependency: without it pytest reports the two keys as unknown config
# options and runs exactly as before, so this file is safe either way. Install
# it locally (see README.md) to get the bound.
#
# Note the bound is per test. It cannot interrupt a hang at interpreter
# shutdown, which is why every loopback server thread in this tree is a daemon
# thread; see README.md, "Local execution".
[pytest]
timeout = 300
timeout_method = signal
