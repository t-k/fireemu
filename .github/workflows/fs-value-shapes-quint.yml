name: FS value shapes Quint generation

on:
  push:
    branches: [work/fs-value-shapes-quint-ci]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 8e1f2a37a9d3c1f5505ce394b3e1f274cf67bda8
      - run: test "$(git rev-parse HEAD)" = 8e1f2a37a9d3c1f5505ce394b3e1f274cf67bda8
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - name: install protected verification JDK
        shell: bash
        run: |
          set -euo pipefail
          java_path="$(readlink -f "$(command -v java)")"
          source_jdk="$(dirname "$(dirname "$java_path")")"
          test "$source_jdk" != / && test -x "$source_jdk/bin/java"
          test -x "$source_jdk/bin/javac" && test -x "$source_jdk/bin/jar"

          protected_jdk="$(sudo mktemp -d /usr/lib/fireemu-quint-jdk.XXXXXX)"
          # Dereference internal JDK symlinks so every executable remains inside the protected
          # copy and no permissive symlink mode is mistaken for an executable permission.
          sudo cp -aL "$source_jdk"/. "$protected_jdk"/
          sudo chown -R root:root "$protected_jdk"
          sudo chmod -R go-w "$protected_jdk"
          sudo chmod 0755 "$protected_jdk"

          for executable in java javac jar; do
            path="$protected_jdk/bin/$executable"
            test -x "$path"
            resolved="$(readlink -f "$path")"
            test "$resolved" = "$path"
          done

          # trusted_path() rejects any non-root-owned or caller-writable ancestor.
          test "$(find "$protected_jdk" -xdev \( ! -user root -o -perm /022 \) -print -quit)" = ""
          for executable in java javac jar; do
            path="$protected_jdk/bin/$executable"
            parent="$path"
            while true; do
              test "$(stat -c '%u' "$parent")" = 0
              mode="$(stat -c '%a' "$parent")"
              test "$((8#$mode & 022))" = 0
              test "$parent" != / || break
              parent="$(dirname "$parent")"
            done
          done

          echo "JAVA_HOME=$protected_jdk" >> "$GITHUB_ENV"
          echo "$protected_jdk/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - name: verify pinned Rust toolchain
        run: rustc --version | tee /dev/stderr | grep -q "$(sed -n 's/^channel = \"\(.*\)\"/\1/p' rust-toolchain.toml)"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: "10.32.1"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: verification/quint/pnpm-lock.yaml
      - name: install pinned Quint
        run: pnpm -C verification/quint install --frozen-lockfile
      - name: install verified Apalache backend
        run: |
          quint_home="$RUNNER_TEMP/quint-home"
          QUINT_HOME="$quint_home" verification/quint/bin/install-apalache
          echo "QUINT_HOME=$quint_home" >> "$GITHUB_ENV"
      - name: configure guarded Quint path
        run: |
          echo "QUINT_REAL_BIN=$GITHUB_WORKSPACE/verification/quint/node_modules/.bin/quint" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/verification/quint/bin" >> "$GITHUB_PATH"
      - name: fetch locked workspace dependencies for offline authority checks
        run: cargo fetch --locked
      - name: Generate affected evidence
        run: |
          set -euo pipefail
          for model in AwaitIdle FirestoreListenRefresh CompatibilitySelection AtomicExportPublication AtomicCommitOutbox LimitRejection; do
            cargo run --locked -p fireemu-verification-quint -- mutate-model --model "$model" --evidence "verification/quint/evidence/$model.json"
            cargo run --locked -p fireemu-verification-quint -- verify-evidence --model "$model" --evidence "verification/quint/evidence/$model.json"
          done
          sha256sum crates/fireemu-adapter-grpc/src/pipeline.rs > candidate-source.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fs-value-shapes-quint
          path: |
            verification/quint/evidence/AwaitIdle.json
            verification/quint/evidence/FirestoreListenRefresh.json
            verification/quint/evidence/CompatibilitySelection.json
            verification/quint/evidence/AtomicExportPublication.json
            verification/quint/evidence/AtomicCommitOutbox.json
            verification/quint/evidence/LimitRejection.json
            candidate-source.sha256
          if-no-files-found: error
