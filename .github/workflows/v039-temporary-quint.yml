name: v039 candidate seven-model evidence
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  npm-remaining:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: e52085f050a1aac12087596c648fe75028b5c699
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: node --test npm/scripts/launcher.test.mjs npm/scripts/recover-v0381.test.mjs npm/scripts/verify-install.test.mjs
