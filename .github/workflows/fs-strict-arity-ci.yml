name: fs-strict-arity-ci
on:
  push:
    branches: [work/fs-strict-arity-ci]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 848a92a8b614383bb3dd0cef192178375e5aed6b
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177
        with:
          tool: cargo-nextest@0.9.143
      - run: |
          test "$(git rev-parse HEAD)" = 848a92a8b614383bb3dd0cef192178375e5aed6b
          cargo nextest run -p fireemu-adapter-grpc --profile pr --locked -E 'test(where_is_type_keeps_static_type_validation)'
