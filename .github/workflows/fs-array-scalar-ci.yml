name: fs-array-scalar-ci
on:
  push:
    branches: [work/fs-array-scalar-ci]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: c7f8ebce7e406cca18ce3511945e971510c12d87
          fetch-depth: 0
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177
        with:
          tool: cargo-nextest@0.9.143
      - run: |
          test "$(git rev-parse HEAD)" = c7f8ebce7e406cca18ce3511945e971510c12d87
          cargo nextest run -p fireemu-adapter-grpc --profile pr --locked -E 'test(infinity_vector_admission_depends_on_expression_position)'
