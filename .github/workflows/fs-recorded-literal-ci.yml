name: fs-recorded-literal-ci
on:
  push:
    branches: [work/fs-recorded-literal-ci]
permissions:
  contents: read
jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 0bf021a55a7f4c46d52599ac50383401a73c1fbc
          fetch-depth: 0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: .ci-helper
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177
        with:
          tool: cargo-nextest@0.9.143
      - name: Verify source and generic gRPC gate mutation
        run: |
          test "$(git rev-parse HEAD)" = 0bf021a55a7f4c46d52599ac50383401a73c1fbc
          test "$(git -C .ci-helper rev-parse HEAD)" = "$GITHUB_SHA"
          python3 .ci-helper/.github/temporary/grpc_generic_mutation.py
      - name: Preserve mutation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: literal-grpc-generic-mutation
          path: /tmp/grpc-generic-mutant/
          if-no-files-found: warn
