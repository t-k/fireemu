name: fs-numeric-mutants-ci
on:
  push:
    branches: [work/fs-numeric-core-ci]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        mutant: [noop, extrema, sum, negate]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 8fb0d44f7fd7d58474dc4b2bb6aa22deae413ca3
          fetch-depth: 0
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177
        with:
          tool: cargo-nextest@0.9.143
      - env:
          MUTANT: ${{ matrix.mutant }}
        run: |
          test "$(git rev-parse HEAD)" = 8fb0d44f7fd7d58474dc4b2bb6aa22deae413ca3
          python3 - <<'PY'
          import os
          from pathlib import Path
          path = Path('crates/fireemu-core-firestore/src/pipeline_exec/scalar.rs')
          source = path.read_text()
          changes = {'extrema': ('let selected = if maximum {', 'let selected = if !maximum {'), 'sum': ('let mut total = 0_i64;', 'let mut total = 1_i64;'), 'negate': ('value.checked_neg().map_or_else(', 'value.checked_abs().map_or_else(')}
          if os.environ['MUTANT'] != 'noop':
              old, new = changes[os.environ['MUTANT']]
              assert source.count(old) == 1
              path.write_text(source.replace(old, new))
          PY
          set +e
          sudo systemd-run --scope -p MemoryMax=6G -p MemorySwapMax=0 --uid="$(id -u)" --gid="$(id -g)" env PATH="$PATH" HOME="$HOME" cargo nextest run -p fireemu-core-firestore --profile pr --locked --no-fail-fast -E 'test(numeric_scalar_)'
          status=$?
          set -e
          if [ "$MUTANT" = noop ]; then test "$status" = 0; else test "$status" = 100; fi
