name: fs-r21-refusals-ci
on:
  push:
    branches: [work/fs-r21-refusals-ci]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: a02540a5f1eec7ba1b40d72bea8493c0e55e9395
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177
        with:
          tool: cargo-nextest@0.9.143
      - name: Run all affected tests without fail fast
        run: |
          test "$(git rev-parse HEAD)" = a02540a5f1eec7ba1b40d72bea8493c0e55e9395
          test -z "$(git status --porcelain)"
          sudo systemd-run --scope --unit=fs-r21-tests -p MemoryMax=6G -p MemorySwapMax=0 --uid="$(id -u)" --gid="$(id -g)" env PATH="$PATH" HOME="$HOME" RUSTC_WRAPPER= bash -c 'systemctl show fs-r21-tests.scope -p MemoryMax -p MemorySwapMax -p MemoryCurrent; exec cargo nextest run --manifest-path Cargo.toml --locked --profile pr --no-fail-fast -p fireemu-core-firestore -p fireemu-adapter-grpc'
      - name: Run clippy independently
        if: always()
        run: |
          test "$(git rev-parse HEAD)" = a02540a5f1eec7ba1b40d72bea8493c0e55e9395
          sudo systemd-run --scope --unit=fs-r21-clippy -p MemoryMax=6G -p MemorySwapMax=0 --uid="$(id -u)" --gid="$(id -g)" env PATH="$PATH" HOME="$HOME" RUSTC_WRAPPER= bash -c 'systemctl show fs-r21-clippy.scope -p MemoryMax -p MemorySwapMax -p MemoryCurrent; exec cargo clippy --manifest-path Cargo.toml --locked -p fireemu-core-firestore -p fireemu-adapter-grpc --all-targets --all-features -- -D warnings'
          test -z "$(git status --porcelain)"
