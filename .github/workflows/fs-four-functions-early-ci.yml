name: fs-four-functions-early-ci
on:
  push:
    branches: [work/fs-four-functions-early-ci]
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 57acea352f298d427be0d87ff23a427ab1b40f59
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.32.1
      - name: Prepare and build
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = 57acea352f298d427be0d87ff23a427ab1b40f59
          mkdir -p "$RUNNER_TEMP/fs-four"
          printf '%s\n' "$(git rev-parse HEAD)" > "$RUNNER_TEMP/fs-four/source.txt"
          pnpm -C conformance install --frozen-lockfile
          sudo systemd-run --scope -p MemoryMax=6G -p MemorySwapMax=0 --uid="$(id -u)" --gid="$(id -g)" env PATH="$PATH" HOME="$HOME" cargo build -p fireemu --locked
          cp target/debug/fireemu "$RUNNER_TEMP/fs-four/fireemu"
          sha256sum "$RUNNER_TEMP/fs-four/fireemu" > "$RUNNER_TEMP/fs-four/binary.sha256"
          printf %s  | base64 -d > conformance/src/fs-ent-pipeline/arrays-captured-cli.mjs
          echo "8610dc4781d88f48056bb6fec1905c0aceb5e63500b8d2b5a5ff7aa56bbe07e9  conformance/src/fs-ent-pipeline/arrays-captured-cli.mjs" | sha256sum -c
          printf %s  | base64 -d > conformance/src/fs-ent-pipeline/arrays-captured-replay.mjs
          echo "12f76b64ca3048aed094d3af0442ae4767048eded8d8a9213c13d5a1f211d046  conformance/src/fs-ent-pipeline/arrays-captured-replay.mjs" | sha256sum -c
          printf %s  | base64 -d > conformance/src/fs-ent-pipeline/arrays-control-corpus.mjs
          echo "8cb93b7eecce9aa0085b1b820749ed7b8cd4153239d28372724adb0e29d57c45  conformance/src/fs-ent-pipeline/arrays-control-corpus.mjs" | sha256sum -c
          printf %s  | base64 -d > conformance/src/fs-ent-pipeline/arrays-control-observation.mjs
          echo "b31a608cc1f65a6be56f3fc1fdda987a29dfde0c0075173105e3cafc46ab77eb  conformance/src/fs-ent-pipeline/arrays-control-observation.mjs" | sha256sum -c
          printf %s  | base64 -d > conformance/src/fs-ent-pipeline/stage-context-target.mjs
          echo "78f8e9d0222e0df6f1564a71943e92857c06ae195be328e4ea6fc494ad0f760e  conformance/src/fs-ent-pipeline/stage-context-target.mjs" | sha256sum -c
          sha256sum conformance/src/fs-ent-pipeline/arrays-captured-cli.mjs conformance/src/fs-ent-pipeline/arrays-captured-replay.mjs conformance/src/fs-ent-pipeline/arrays-control-corpus.mjs conformance/src/fs-ent-pipeline/arrays-control-observation.mjs conformance/src/fs-ent-pipeline/builders.mjs conformance/src/fs-ent-pipeline/harness.mjs conformance/src/fs-ent-pipeline/stage-context-target.mjs conformance/src/fs-query-index/values.mjs conformance/pnpm-lock.yaml > "$RUNNER_TEMP/fs-four/closure.sha256"
          node -e "for (const p of ['@google-cloud/firestore','@grpc/grpc-js']) {const f=require.resolve(p+'/package.json',{paths:['./conformance']}); console.log(p,require(f).version,f)}" > "$RUNNER_TEMP/fs-four/sdk.txt"
          node --input-type=module -e "import {arraysControlRecipes} from './conformance/src/fs-ent-pipeline/arrays-control-corpus.mjs'; import {writeFileSync} from 'node:fs'; const c=arraysControlRecipes(); writeFileSync(process.argv[1],JSON.stringify({cases:20,rounds:2,observations:[1,2].flatMap(round=>c.map(x=>({id:x.id,round})))}));" "$RUNNER_TEMP/fs-four/synthetic.json"
      - name: Isolated local replay
        run: |
          set -eu
          sudo systemd-run --scope -p MemoryMax=1G -p MemorySwapMax=0 sudo unshare --net --pid --fork --mount-proc --kill-child sh -c '
            ip link set lo up
            test "$$" = 1
            test "$(readlink /proc/1/ns/pid)" = "$(readlink /proc/self/ns/pid)"
            printf "pid_namespace_init=1\nnetwork_namespace=isolated\n" > "$3/namespace.txt"
            exec setpriv --reuid="$1" --regid="$2" --init-groups -- env -u GOOGLE_APPLICATION_CREDENTIALS FIREEMU_SANDBOX_LANE=fs-ent-pipeline "$3/fireemu" exec --config conformance/fs-ent-pipeline.fireemu.json --project demo-local --only firestore --firestore-port 0 --http-port 0 --storage-port 0 --ui-port 0 --hub-port 0 --logging-port 0 --firebase-json conformance/fs-ent-pipeline.firebase.json -- sh -c '''port=${FIRESTORE_EMULATOR_HOST##*:}; exec node conformance/src/fs-ent-pipeline/arrays-captured-cli.mjs "http://127.0.0.1:$port" 127.0.0.1 "$port" strict "$1/synthetic.json" "$1/raw.json"''' sh "$3"
          ' sh "$(id -u)" "$(id -g)" "$RUNNER_TEMP/fs-four" > "$RUNNER_TEMP/fs-four/replay.log" 2>&1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: fs-four-functions-early-local
          path: ${{ runner.temp }}/fs-four/
          if-no-files-found: error
          retention-days: 7
