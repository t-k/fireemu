name: fs-observed-generic-mutants
on:
  push:
    branches: [work/fs-observed-generic-ci]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        mutant: [noop, minimum, maximum, 'null', absent, promotion, nonnumeric, negate]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 6e185fb1704026bbfabe6ae8e30ece000e25b7e4
          fetch-depth: 0
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177
        with:
          tool: cargo-nextest@0.9.143
      - env:
          MUTANT: ${{ matrix.mutant }}
        run: |
          test "$(git rev-parse HEAD)" = 6e185fb1704026bbfabe6ae8e30ece000e25b7e4
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path('crates/fireemu-core-firestore/src/pipeline_exec/scalar.rs')
          s = p.read_text()
          start = s.index('fn extrema(')
          end = s.index('fn eval_abs(', start)
          part = s[start:end]
          changes = {
            'minimum': ('min_by(|a, b| a.canonical_cmp(b))', 'max_by(|a, b| a.canonical_cmp(b))'),
            'maximum': ('max_by(|a, b| a.canonical_cmp(b))', 'min_by(|a, b| a.canonical_cmp(b))'),
            'null': ('.filter(|value| !matches!(value, Value::Null))', '.filter(|_value| true)'),
            'absent': ('if let Some(error) = first_error(args) {', 'if args.iter().any(|arg| matches!(arg, Eval::Absent)) { return unobserved(name, "mutant"); }\n    if let Some(error) = first_error(args) {'),
            'promotion': ('NumberSum::Double(value) => double(value)', 'NumberSum::Double(_value) => integer(0)'),
            'nonnumeric': ('let Ok(sum) = total.add(value) else {', 'if matches!(value, Value::String(_)) { return unobserved("sum", "mutant"); }\n        let Ok(sum) = total.add(value) else {'),
            'negate': ('double(-value)', 'double(*value)'),
          }
          if os.environ['MUTANT'] != 'noop':
              old, new = changes[os.environ['MUTANT']]
              if os.environ['MUTANT'] == 'absent':
                  assert part.count(old) == 3
                  part = part.replace(old, new, 1)
              else:
                  assert part.count(old) == 1, (os.environ['MUTANT'], part.count(old))
                  part = part.replace(old, new)
              p.write_text(s[:start] + part + s[end:])
          PY
          set +e
          sudo systemd-run --scope -p MemoryMax=6G -p MemorySwapMax=0 --uid="$(id -u)" --gid="$(id -g)" env PATH="$PATH" HOME="$HOME" cargo nextest run -p fireemu-core-firestore --profile pr --locked --no-fail-fast -E 'test(numeric_scalar_)'
          status=$?
          set -e
          if [ "$MUTANT" = noop ]; then test "$status" = 0; else test "$status" = 100; fi
