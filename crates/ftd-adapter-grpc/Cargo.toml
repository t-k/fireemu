[package]
name = "ftd-adapter-grpc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "gRPC shell: Firestore v1 wire decoding, strict gateway validation, optional upstream proxy"

[dependencies]
ftd-core-types = { path = "../ftd-core-types" }
ftd-core-limits = { path = "../ftd-core-limits" }
ftd-core-firestore = { path = "../ftd-core-firestore" }
ftd-core-session = { path = "../ftd-core-session" }
ftd-core-rules = { path = "../ftd-core-rules" }
ftd-core-auth = { path = "../ftd-core-auth" }
ftd-proto-firestore = { path = "../ftd-proto-firestore" }
prost-types = "0.13"
tonic = { version = "0.13", features = ["transport", "codegen", "prost"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "sync"] }

tokio-stream = "0.1"
serde_json.workspace = true
hyper = { version = "1", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "server"] }
http-body-util = "0.1"
bytes = "1"

[dev-dependencies]
tokio-stream = { version = "0.1", features = ["net"] }

[lints]
workspace = true
