name: fireemu_sdk_smoke_flutter
description: Bounded macOS FlutterFire client smoke for local emulators.
publish_to: none
version: 0.0.1
environment:
  sdk: '>=3.11.3 <4.0.0'
  flutter: '3.41.5'
dependencies:
  flutter:
    sdk: flutter
  firebase_core: 4.5.0
  firebase_auth: 6.2.0
  cloud_firestore: 6.1.3
  firebase_storage: 13.1.0
  firebase_database: 12.1.4
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
flutter:
  config:
    enable-swift-package-manager: false
