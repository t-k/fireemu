name: fs-strict-arity-ci
on:
  push:
    branches: [work/fs-strict-arity-post-ci]
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: preserve private runner tools and checkout source
        run: |
          cp tools/tmp-preflight/portctl.py /tmp/fs-strict-portctl.py
          cp tools/tmp-preflight/programs.mjs /tmp/fs-strict-programs.mjs
          cp tools/tmp-preflight/report.py /tmp/fs-strict-report.py
          git checkout --detach fba43560f9a8a8edc16565c62e3953c3234225ca
          test "$(git rev-parse HEAD)" = fba43560f9a8a8edc16565c62e3953c3234225ca
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: '10.32.1'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: build and capture
        shell: bash
        run: |
          set -euo pipefail
          pnpm -C conformance install --frozen-lockfile
          cargo build -p fireemu --locked
          sha256sum target/debug/fireemu > /tmp/fs-strict-binary.sha256
          cp /tmp/fs-strict-programs.mjs tools/tmp-preflight-programs.mjs
          node tools/tmp-preflight-programs.mjs
          rm tools/tmp-preflight-programs.mjs
          export FIREEMU_SANDBOX_LANE=fs-ent-pipeline
          export FS_QUERY_INDEX_IN=/tmp/fs-strict-arity-programs.json
          export FS_QUERY_INDEX_OUT=/tmp/fs-strict-arity-fireemu.json
          export FS_QUERY_INDEX_RUN=1793400000000
          python3 /tmp/fs-strict-portctl.py run --service fs-strict-arity --range 20000-29999 -- bash -c 'exec target/debug/fireemu exec --config conformance/fs-ent-pipeline.fireemu.json --project fireemu-oracle-query --only firestore --firestore-port "$PORT" --hub-port 0 --logging-port 0 --firebase-json conformance/fs-ent-pipeline.firebase.json -- node conformance/src/fs-query-index/run.mjs session-local'
          python3 /tmp/fs-strict-report.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: fs-strict-arity-postflight
          path: |
            /tmp/fs-strict-arity-programs.json
            /tmp/fs-strict-arity-fireemu.json
            /tmp/fs-strict-arity-comparison.json
            /tmp/fs-strict-binary.sha256
          if-no-files-found: error
