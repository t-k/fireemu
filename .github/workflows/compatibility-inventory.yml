name: compatibility-inventory

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  feature-inventory-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install the repository-pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: compatibility-inventory
      - name: Validate requirement references and generated feature tables
        run: cargo run --locked -p compat-check
      - name: Test the feature inventory integrity gate
        run: cargo test --locked -p compat-check
  offline-acquisition-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install uv
        run: python3 -m pip install uv==0.11.28
      - name: Test acquisition and candidate receipt contracts
        run: uv run --project tools/compat-inventory --locked --python 3.12 -m pytest tools/compat-inventory tools/aggregation-limit tools/auth-basic tools/auth-basic-v2 tools/auth-profile tools/auth-display-name -q
      - name: Check committed inventory and observations without network acquisition
        run: uv run --project tools/compat-inventory --locked --python 3.12 tools/compat-inventory/publish.py --check
      - name: Check sanitized Auth candidate observations
        run: uv run --project tools/compat-inventory --locked --python 3.12 tools/publish-auth-basic.py --check
      - name: Check Auth revision 2 expiry and redacted provenance
        run: uv run --project tools/compat-inventory --locked --python 3.12 tools/publish-auth-v2.py --check
      - name: Check subject-bound Auth revision 2 human approval
        run: uv run --project tools/compat-inventory --locked --python 3.12 tools/auth-v2-approval.py --check
      - name: Check bounded Auth photo URL candidate observations
        run: uv run --project tools/compat-inventory --locked --python 3.12 tools/publish-auth-profile.py --check
      - name: Check subject-bound Auth photo URL human approval
        run: uv run --project tools/compat-inventory --locked --python 3.12 tools/auth-profile-approval.py --check
      - name: Check bounded Auth displayName candidate observations
        run: uv run --project tools/compat-inventory --locked --python 3.12 tools/publish-auth-display-name.py --check
      - name: Check subject-bound Auth displayName human approval
        run: uv run --project tools/compat-inventory --locked --python 3.12 tools/auth-display-name-approval.py --check
