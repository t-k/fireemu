name: RTDB namespace probe (temporary)
on:
  push:
    branches: [work/rtdb-namespace-ci]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 667365658c95501b744af3c164a2d491705c615d
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.32.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.14.0
      - name: Bind the exact source and probe
        run: |
          mkdir probe-evidence
          git rev-parse HEAD | tee probe-evidence/source-head.txt
          test "$(git rev-parse HEAD)" = 667365658c95501b744af3c164a2d491705c615d
          sha256sum conformance/src/rtdb-namespace-probe.mjs | tee probe-evidence/probe-sha256.txt
          echo '08a5529f6c91f1ad2b861c2a0f652138614465061add1a290bcae6563a89fd56  conformance/src/rtdb-namespace-probe.mjs' | sha256sum -c -
      - name: Install locked conformance dependencies
        run: pnpm -C conformance install --frozen-lockfile
      - name: Check real Node inherited streams and negative controls
        run: |
          set -o pipefail
          node --test --test-name-pattern='actual Node stderr inheritance|probe requires matching inherited|namespace probe refuses signals' conformance/src/rtdb-release-replay.test.mjs 2>&1 | tee probe-evidence/stream-tests.log
      - name: Exercise PID namespace and detached timeout
        run: |
          set +e
          set -o pipefail
          sudo env PATH="$PATH" HOME="$HOME" node conformance/src/rtdb-namespace-probe.mjs --out probe-evidence/namespace 2>&1 | tee probe-evidence/probe.log
          probe_status=${PIPESTATUS[0]}
          set -e
          if test -f probe-evidence/namespace/receipt.json; then
            jq -c '{ok, launcherIdentity, identity, rejections, innerPid, remaining, outcome, namespace: .summary.namespace, witnessAck: .summary.witnessAck, fatal: .summary.fatal, observed: .summary.observed, commandCount: (.summary.runs[0].commands | length), commandExit: .summary.runs[0].commands[0].exitCode, later, cleanupUnverified}' probe-evidence/namespace/receipt.json
          fi
          exit "$probe_status"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rtdb-namespace-probe-evidence
          path: probe-evidence
          if-no-files-found: error
