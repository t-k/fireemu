name: compatibility-inventory

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  feature-inventory-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install the repository-pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: compatibility-inventory
      - name: Validate requirement references and generated feature tables
        run: cargo run --locked -p compat-check
      - name: Test the feature inventory integrity gate
        run: cargo test --locked -p compat-check
      - name: Test current update field authorization and maximum boundary
        run: |
          cargo test --locked -p fireemu-adapter-http --test identity_toolkit admin_fields
          cargo test --locked -p fireemu-adapter-http --test identity_toolkit password_maximum_update
          cargo test --locked -p fireemu-adapter-http --test identity_toolkit disabled_account_preserves
          cargo test --locked -p fireemu-core-auth --test jwt disabled_user
          cargo test --locked -p fireemu-core-auth deleted_refresh
          cargo test --locked -p fireemu-adapter-http --test identity_toolkit deleted_account_credentials
          cargo test --locked -p fireemu-adapter-http --test identity_toolkit lookup_authorization
          cargo test --locked -p fireemu-adapter-http --test auth_flows oob_authorization
          cargo test --locked -p fireemu-adapter-http --test auth_flows two_party
          cargo test --locked -p fireemu-adapter-http --test auth_flows pending_retry
          cargo test --locked -p fireemu-core-auth --test mfa pending_retry
  offline-acquisition-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install uv
        run: python3 -m pip install uv==0.11.28
      - name: Check the pending-revocation recorder contract and its published receipt
        run: |
          uv run --project tools/compat-inventory --locked --python 3.12 -m pytest tools/auth-pending-revocation -q
          uv run --project tools/compat-inventory --locked --python 3.12 tools/publish-auth-pending-revocation.py --check
          uv run --project tools/compat-inventory --locked --python 3.12 tools/auth-pending-revocation-approval.py --check
          uv run --project tools/compat-inventory --locked --python 3.12 -m pytest tools/auth-blocking-disable -q
          uv run --project tools/compat-inventory --locked --python 3.12 tools/publish-auth-blocking-disable.py --check
          uv run --project tools/compat-inventory --locked --python 3.12 tools/auth-blocking-disable-approval.py --check
          uv run --project tools/compat-inventory --locked --python 3.12 tools/publish-auth-blocking-disable-comparison.py --check
          uv run --project tools/compat-inventory --locked --python 3.12 -m pytest tools/auth-disabled-admin-update -q
          uv run --project tools/compat-inventory --locked --python 3.12 tools/publish-auth-disabled-admin-update.py --check
          uv run --project tools/compat-inventory --locked --python 3.12 tools/publish-auth-pending-revocation-comparison.py --check
          uv run --project tools/compat-inventory --locked --python 3.12 -m pytest tools/auth-blocking-create-disable tools/auth-blocking-readback -q
          uv run --project tools/compat-inventory --locked --python 3.12 tools/publish-auth-blocking-create-disable-r1.py --check
      - name: Check immutable historical tools, observations and approvals
        run: uv run --project tools/compat-inventory --locked --python 3.12 tools/compat-history/history.py --check
      - name: Check later approved observations at their fixed historical source
        run: uv run --project tools/compat-inventory --locked --python 3.12 tools/compat-history/password_history.py --check
      - name: Test current historical isolation
        run: uv run --project tools/compat-inventory --locked --python 3.12 -m pytest tools/compat-history -q
      - name: Check immutable maximum observations and approval at their recorded source
        run: uv run --project tools/compat-inventory --locked --python 3.12 tools/compat-history/maximum_history.py --check
      - name: Check original Unicode mismatch at its fixed historical source
        run: uv run --project tools/compat-inventory --locked --python 3.12 tools/compat-history/unicode_history.py --check
      - name: Check pre-disable-fix observations and approvals at their fixed source
        run: uv run --project tools/compat-inventory --locked --python 3.12 tools/compat-history/disabled_history.py --check
      - name: Check original deletion mismatch and prior approval at their fixed source
        run: uv run --project tools/compat-inventory --locked --python 3.12 tools/compat-history/deleted_history.py --check
      - name: Check approved deletion recheck at its fixed pre-lookup-fix source
        run: uv run --project tools/compat-inventory --locked --python 3.12 tools/compat-history/lookup_history.py --check
