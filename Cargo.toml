[workspace]
resolver = "2"
members = [
    "crates/ftd-core-types",
    "crates/ftd-core-limits",
    "crates/ftd-core-session",
    "crates/ftd-core-events",
    "crates/ftd-core-firestore",
    "crates/ftd-core-rules",
    "crates/ftd-core-auth",
    "crates/ftd-core-storage",
    "crates/ftd-core-functions",
    "crates/ftd-proto-firestore",
    "crates/ftd-adapter-grpc",
    "crates/ftd-adapter-http",
    "crates/ftd-adapter-functions",
    "crates/ftd-adapter-ui",
    "crates/firebase-testd",
    "tools/limit-catalog-gen",
    "tools/traceability-check",
    "tools/config-schema-check",
    "tools/proto-gen",
    "verification/loom",
    "verification/kani",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/reckona/firebase-testd"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)", "cfg(kani)"] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic lints we intentionally relax.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[workspace.dependencies]
proptest = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
