name: functions-sdk-discovery

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  real-sdk-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tools/sdk-smoke/package-lock.json
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: functions-sdk-discovery
      - name: install the real Functions SDK fixture
        run: npm ci --prefix tools/sdk-smoke --ignore-scripts
      - name: run every real SDK discovery scenario
        run: cargo test -p fireemu --test functions_discovery -- --ignored --test-threads=1
      - name: run every real SDK multi-codebase scenario
        run: cargo test -p fireemu --test functions_codebases -- --ignored --test-threads=1
      - name: verify Functions environment, routing, secret isolation and reload
        run: cargo test -p fireemu --test functions_environment -- --include-ignored
      - name: verify runner trust boundaries and log attribution
        run: node --test tools/runner-node/*.test.mjs
