[package]
name = "fireemu-fd-acl"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Reads whether an open file descriptor carries extended ACL entries (macOS); the workspace's only unsafe code"

[dependencies]

# This crate is the one exception to the workspace's `unsafe_code = "forbid"`, approved by the
# owner for reading an ACL through an open descriptor ("Session RSA cache macOS ACL fix").
# Cargo cannot override a single inherited lint, so the workspace tables are restated here
# with `unsafe_code = "deny"` instead of "forbid": only the FFI module opts out, with a local
# `#[allow(unsafe_code)]`, and unsafe code anywhere else in the crate still fails the build.
# The unsafe-specific lints below make every unsafe block carry a SAFETY comment and hold
# one unsafe operation. `tests/lint_policy.rs` keeps the rest in step with the workspace.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)", "cfg(kani)"] }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
missing_safety_doc = "deny"
