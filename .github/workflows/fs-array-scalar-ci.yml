name: fs-array-scalar-ci
on:
  push:
    branches: [work/fs-array-scalar-ci]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 8d9163e72115ca71138091e17c431bd88c4262f1
          fetch-depth: 0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: .ci-helper
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177
        with:
          tool: cargo-nextest@0.9.143
      - name: Verify exact source and affected crates
        run: |
          test "$(git rev-parse HEAD)" = 8d9163e72115ca71138091e17c431bd88c4262f1
          test "$(git -C .ci-helper rev-parse HEAD)" = "$GITHUB_SHA"
          cargo nextest run -p fireemu-core-firestore -p fireemu-adapter-grpc --profile pr --locked
          cargo clippy -p fireemu-core-firestore -p fireemu-adapter-grpc --all-targets --locked -- -D warnings
          python3 .ci-helper/.github/temporary/nested_infinity_mutation.py
      - name: Preserve mutation logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nested-infinity-mutation-results
          path: /tmp/nested-infinity-mutant/
          if-no-files-found: warn
