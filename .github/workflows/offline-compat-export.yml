name: v041 source-bound transaction debug binary
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Version-bumped frozen source commit SHA
        required: true
        type: string
      version:
        description: Expected workspace version
        default: 0.41.0
        required: true
        type: string
permissions:
  contents: read
jobs:
  txn_binary:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      EXPECTED_SOURCE: ${{ inputs.source_sha }}
      EXPECTED_VERSION: ${{ inputs.version }}
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      RUSTC_WRAPPER: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify clean immutable source and no UI bundle
        shell: bash
        run: |
          [[ "$EXPECTED_SOURCE" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          test -z "$(git status --porcelain)"
          test ! -e target
          test ! -e ui/dist/index.html
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      - name: Build and capture source-bound debug artifact
        env:
          OUT: ${{ runner.temp }}/v041-txn-debug
        shell: bash
        run: |
          set -euo pipefail
          test ! -e "$OUT"
          mkdir -m 700 "$OUT"
          echo  | base64 -d > "$OUT/driver.sh"
          sudo systemd-run --scope --quiet -p MemoryMax=6442450944 -p MemorySwapMax=0 \
            setpriv --reuid="$(id -u)" --regid="$(id -g)" --init-groups -- \
            env PATH="$PATH" HOME="$HOME" RUNNER_TEMP="$RUNNER_TEMP" OUT="$OUT" EXPECTED_SOURCE="$EXPECTED_SOURCE" EXPECTED_VERSION="$EXPECTED_VERSION" \
            CARGO_INCREMENTAL=0 CARGO_BUILD_JOBS=2 RUSTC_WRAPPER= bash "$OUT/driver.sh"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v041-txn-linux-arm64-debug
          path: ${{ runner.temp }}/v041-txn-debug
          if-no-files-found: warn
