name: fs-observed-generic-ci
on:
  push:
    branches: [work/fs-observed-generic-ci]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 939aeabf7af1bea6da89e076f617abb2214d94a5
          fetch-depth: 0
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177
        with:
          tool: cargo-nextest@0.9.143
      - run: |
          test "$(git rev-parse HEAD)" = 939aeabf7af1bea6da89e076f617abb2214d94a5
          set +e
          sudo systemd-run --scope -p MemoryMax=6G -p MemorySwapMax=0 --uid="$(id -u)" --gid="$(id -g)" env PATH="$PATH" HOME="$HOME" cargo nextest run -p fireemu-core-firestore --profile pr --locked -E 'test(observed_replace_document_id_refuses_descendant_paths)'
          status=$?
          set -e
          test "$status" = 100
