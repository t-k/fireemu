name: fs-array-scalar-ci
on:
  push:
    branches: [work/fs-array-scalar-ci]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 4e76ad707fd60350537acc791fb6f958508a9420
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177
        with:
          tool: cargo-nextest@0.9.143
      - run: |
          test "$(git rev-parse HEAD)" = 4e76ad707fd60350537acc791fb6f958508a9420
          cargo nextest run -p fireemu-adapter-grpc --profile pr --locked -E 'test(recorded_infinite_vectors_and_documents_root_preserve_types)'
