name: fs-r21-refusals-ci
on:
  push:
    branches: [work/fs-r21-refusals-ci]
permissions:
  contents: read
jobs:
  red:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 88c703b668775669018424845cd9adfd367e495a
      - name: Record failing tests with memory limit
        run: |
          test "$(git rev-parse HEAD)" = $(git rev-parse 88c703b668775669018424845cd9adfd367e495a)
          sudo systemd-run --scope -p MemoryMax=6G -p MemorySwapMax=0 --uid="$(id -u)" --gid="$(id -g)" env PATH="$PATH" HOME="$HOME" RUSTC_WRAPPER= cargo test --locked --manifest-path crates/fireemu-adapter-grpc/Cargo.toml recorded_sort_and_accumulator_unknown_candidates -- --nocapture
      - name: Record scalar failing test with memory limit
        if: always()
        run: |
          sudo systemd-run --scope --unit=fs-r21-scalar-red -p MemoryMax=6G -p MemorySwapMax=0 --uid="$(id -u)" --gid="$(id -g)" env PATH="$PATH" HOME="$HOME" RUSTC_WRAPPER= bash -c 'systemctl show fs-r21-scalar-red.scope -p MemoryMax -p MemorySwapMax -p MemoryCurrent; exec cargo test --locked --manifest-path crates/fireemu-core-firestore/Cargo.toml nested_sum_uses_actual_row_type -- --nocapture'
