name: sdk-latest

# The SDK smokes in tools/sdk-smoke pin firebase-admin and firebase so the suite is
# reproducible. This workflow runs the Storage and client smokes against whatever `npm` calls
# `latest` today, under `fireemu exec` with the environment the command really receives, so a
# new SDK release that breaks a documented `exec` flow shows up here and not in a user's CI
# (firebase-admin 14.4 and @google-cloud/storage 8.1 refused the credentialed
# STORAGE_EMULATOR_HOST that `exec` used to export, and no pinned smoke saw it).
# The source job runs on pull requests, pushes, dispatches, and the weekly schedule.
# published-light runs npm packages on the daily schedule and light dispatch with Storage and client smokes.
# published-broad runs weekly and on broad dispatch with Storage, client, functions, auth,
# Firestore listener, and transaction smokes.
# Both published jobs record passing combinations as artifacts only; they never write a cache,
# push, or open a pull request.

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Which published-package suite to run. The source build always runs on dispatch."
        type: choice
        options: [light, broad]
        default: broad
  schedule:
    - cron: '0 4 * * *'
    - cron: '0 3 * * 2'
  pull_request:
    paths:
      - .github/workflows/sdk-latest.yml
      - crates/fireemu/src/main.rs
      - crates/fireemu/src/config.rs
      - crates/fireemu/src/daemon.rs
      - crates/fireemu-adapter-http/src/storage*.rs
      - tools/sdk-smoke/storage.mjs
      - tools/sdk-smoke/client.mjs
      - tools/sdk-smoke/sdk-latest-record.mjs
      - tools/sdk-smoke/sdk-latest-record.test.mjs
      - tools/sdk-smoke/fireemu.smoke.json
      - tools/sdk-smoke/package.json
      - tools/sdk-smoke/package-lock.json
  push:
    branches: [main]
    paths:
      - .github/workflows/sdk-latest.yml
      - crates/fireemu/src/main.rs
      - crates/fireemu/src/config.rs
      - crates/fireemu/src/daemon.rs
      - crates/fireemu-adapter-http/src/storage*.rs
      - tools/sdk-smoke/storage.mjs
      - tools/sdk-smoke/client.mjs
      - tools/sdk-smoke/sdk-latest-record.mjs
      - tools/sdk-smoke/sdk-latest-record.test.mjs
      - tools/sdk-smoke/fireemu.smoke.json
      - tools/sdk-smoke/package.json
      - tools/sdk-smoke/package-lock.json

concurrency:
  group: ${{ github.workflow }}-${{ github.event.schedule || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  latest-sdk-under-exec:
    if: github.event_name != 'schedule' || github.event.schedule == '0 3 * * 2'
    # Bound cache tokens even when latest SDK runtime code calls the cache API directly.
    cache-mode: read
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      # Latest SDK runtime code receives read-only cache tokens. Keep the action-level
      # save guard too; release jobs independently avoid dependency caches.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: sdk-latest
          save-if: "false"
      - name: test SDK combination records
        run: node --test tools/sdk-smoke/sdk-latest-record.test.mjs
      - name: build fireemu from this commit
        run: cargo build --locked -p fireemu
      # Not the lockfile: the point is the release a new user gets today. The smokes are copied
      # next to a fresh install because Node resolves their imports from the script's directory.
      - name: install the latest firebase and firebase-admin
        run: |
          set -eu
          dir="$RUNNER_TEMP/sdk-latest"
          mkdir -p "$dir"
          cp tools/sdk-smoke/storage.mjs tools/sdk-smoke/client.mjs tools/sdk-smoke/storage-appcheck-admin.mjs "$dir/"
          admin="$(npm view firebase-admin version)"
          client="$(npm view firebase version)"
          cd "$dir"
          npm init -y > /dev/null
          npm install --ignore-scripts --no-audit --no-fund "firebase-admin@$admin" "firebase@$client"
          # Not require('<pkg>/package.json'): @google-cloud/storage does not export that subpath.
          storage="$(npm query '#@google-cloud/storage' | node -p "JSON.parse(require('node:fs').readFileSync(0, 'utf8')).map((p) => p.version).join(', ')")"
          [ -n "$storage" ] || { echo "@google-cloud/storage is not installed"; exit 1; }
          echo "firebase-admin $admin, firebase $client, @google-cloud/storage $storage"
          {
            echo "### SDK versions under test"
            echo "- firebase-admin $admin"
            echo "- firebase $client"
            echo "- @google-cloud/storage $storage"
          } >> "$GITHUB_STEP_SUMMARY"
      # The smokes keep the STORAGE_EMULATOR_HOST that `exec` exports. They run once under the
      # strict smoke configuration and once under the defaults.
      - name: Admin Storage and client SDK smokes under fireemu exec
        run: |
          set -eu
          dir="$RUNNER_TEMP/sdk-latest"
          bin="$PWD/target/debug/fireemu"
          config="$PWD/tools/sdk-smoke/fireemu.smoke.json"
          appcheck_config="$PWD/tools/sdk-smoke/fireemu.appcheck.json"
          cd "$dir"
          for smoke in storage client; do
            echo "::group::$smoke (strict smoke config)"
            "$bin" exec --config "$config" --project demo-app --hub-port 0 -- node "$smoke.mjs"
            echo "::endgroup::"
          done
          echo "::group::storage (default configuration)"
          "$bin" exec --project demo-app --hub-port 0 -- node storage.mjs
          echo "::endgroup::"
          # Storage App Check enforced: the Admin SDK still gets through on the plain endpoint
          # (appCheck.storageServerRequests "loopback"), resumable uploads included.
          echo "::group::storage-appcheck-admin (Storage App Check enforced)"
          "$bin" exec --config "$appcheck_config" --project demo-app --only storage --hub-port 0 -- node storage-appcheck-admin.mjs
          echo "::endgroup::"

  published-light:
    if: (github.event_name == 'schedule' && github.event.schedule == '0 4 * * *') || (github.event_name == 'workflow_dispatch' && inputs.suite == 'light')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: install published packages
        run: |
          set -eu
          dir="$RUNNER_TEMP/sdk-latest-published"
          mkdir -p "$dir"
          cd "$dir"
          npm init -y
          npm install --no-audit --no-fund fireemu@latest firebase@latest firebase-admin@latest
      - name: prepare smokes and report versions
        run: |
          set -eu
          dir="$RUNNER_TEMP/sdk-latest-published"
          cp tools/sdk-smoke/storage.mjs tools/sdk-smoke/client.mjs "$dir/"
          cd "$dir"
          for package in fireemu firebase firebase-admin; do
            version="$(node -p "require('./node_modules/$package/package.json').version")"
            echo "- $package $version" >> "$GITHUB_STEP_SUMMARY"
          done
      - name: run published package smokes
        run: |
          set -eu
          cd "$RUNNER_TEMP/sdk-latest-published"
          ./node_modules/.bin/fireemu exec --project demo-app --hub-port 0 -- node storage.mjs
          ./node_modules/.bin/fireemu exec --project demo-app --hub-port 0 -- node client.mjs
      - name: record passing combination
        run: |
          set -eu
          dir="$RUNNER_TEMP/sdk-latest-published"
          mkdir -p "$RUNNER_TEMP/sdk-latest-combination"
          node "$GITHUB_WORKSPACE/tools/sdk-smoke/sdk-latest-record.mjs" --suite light --install-dir "$dir" --out "$RUNNER_TEMP/sdk-latest-combination/sdk-latest-combination.json" --smoke storage --smoke client --run-id "$GITHUB_RUN_ID"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sdk-latest-combination-light
          path: ${{ runner.temp }}/sdk-latest-combination/sdk-latest-combination.json
          if-no-files-found: error
          retention-days: 90

  published-broad:
    if: (github.event_name == 'schedule' && github.event.schedule == '0 3 * * 2') || (github.event_name == 'workflow_dispatch' && inputs.suite == 'broad')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: install published packages
        run: |
          set -eu
          dir="$RUNNER_TEMP/sdk-latest-published"
          mkdir -p "$dir"
          cd "$dir"
          npm init -y
          npm install --no-audit --no-fund fireemu@latest firebase@latest firebase-admin@latest firebase-functions@latest
      - name: prepare smokes and report versions
        run: |
          set -eu
          dir="$RUNNER_TEMP/sdk-latest-published"
          cp tools/sdk-smoke/storage.mjs tools/sdk-smoke/client.mjs tools/sdk-smoke/functions.mjs tools/sdk-smoke/auth.mjs tools/sdk-smoke/server-timestamp-transaction-query.mjs tools/sdk-smoke/fireemu.auth.json tools/sdk-smoke/fireemu.smoke.json "$dir/"
          cp tools/sdk-smoke/listener-replacement.mjs tools/sdk-smoke/listener-runtime-compat.mjs tools/sdk-smoke/listener-replacement.firebase.json tools/sdk-smoke/listener-replacement.rules "$dir/"
          cp -R tools/sdk-smoke/functions-project "$dir/functions-project"
          cd "$dir"
          for package in fireemu firebase firebase-admin firebase-functions; do
            version="$(node -p "require('./node_modules/$package/package.json').version")"
            echo "- $package $version" >> "$GITHUB_STEP_SUMMARY"
          done
      - name: run published package smokes
        env:
          FIREEMU_FUNCTIONS_HOST: 127.0.0.1:5001
        run: |
          set -eu
          cd "$RUNNER_TEMP/sdk-latest-published"
          ./node_modules/.bin/fireemu exec --project demo-app --hub-port 0 -- node storage.mjs
          ./node_modules/.bin/fireemu exec --project demo-app --hub-port 0 -- node client.mjs
          ./node_modules/.bin/fireemu exec --config fireemu.smoke.json --project demo-app --functions functions-project --functions-port 5001 --hub-port 0 -- node functions.mjs
          ./node_modules/.bin/fireemu exec --config fireemu.auth.json --project demo-app --only auth -- node auth.mjs
          ./node_modules/.bin/fireemu exec --project demo-app --hub-port 0 -- node server-timestamp-transaction-query.mjs
          ./node_modules/.bin/fireemu exec --firebase-json listener-replacement.firebase.json --only firestore --project demo-app --hub-port 0 -- node listener-replacement.mjs
      - name: record passing combination
        run: |
          set -eu
          dir="$RUNNER_TEMP/sdk-latest-published"
          mkdir -p "$RUNNER_TEMP/sdk-latest-combination"
          node "$GITHUB_WORKSPACE/tools/sdk-smoke/sdk-latest-record.mjs" --suite broad --install-dir "$dir" --out "$RUNNER_TEMP/sdk-latest-combination/sdk-latest-combination.json" --smoke storage --smoke client --smoke functions --smoke auth --smoke firestore-listen-transaction --run-id "$GITHUB_RUN_ID"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sdk-latest-combination-broad
          path: ${{ runner.temp }}/sdk-latest-combination/sdk-latest-combination.json
          if-no-files-found: error
          retention-days: 90
