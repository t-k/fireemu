name: fs-recorded-map-ci
on:
  push:
    branches: [work/fs-recorded-map-ci]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ebf898054a9bd43c1bc1526fc8d97f653dfe5097
          fetch-depth: 0
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177
        with:
          tool: cargo-nextest@0.9.143
      - run: |
          test "$(git rev-parse HEAD)" = ebf898054a9bd43c1bc1526fc8d97f653dfe5097
          cargo nextest run -p fireemu-adapter-grpc --profile pr --locked --no-fail-fast -E 'test(recorded_map_add_fields_refusal_precedes_empty_select)'
