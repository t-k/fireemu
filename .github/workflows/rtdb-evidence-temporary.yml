name: Temporary RTDB mutation verification
on:
  pull_request:
permissions:
  contents: read
jobs:
  mutants:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          components: rustfmt
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177
        with:
          tool: cargo-nextest@0.9.143
      - name: baseline and scoped mutations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mutation-logs
          cargo nextest run -p fireemu-adapter-database --test rules -E 'test(rules_put_reports_independent_errors_in_input_order_and_preserves_rules) | test(rules_put_marks_truncated_diagnostics)' > mutation-logs/baseline.txt 2>&1
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/fireemu-core-database/src/rules/mod.rs')
          s = p.read_text()
          old = 'diagnostics.sort_by_key(|error| (error.line, error.column));'
          assert s.count(old) == 1
          p.write_text(s.replace(old, '// mutation: omit source-order sorting'))
          PY
          if cargo nextest run -p fireemu-adapter-database --test rules -E 'test(rules_put_reports_independent_errors_in_input_order_and_preserves_rules)' > mutation-logs/no-sort.txt 2>&1; then exit 1; fi
          git restore crates/fireemu-core-database/src/rules/mod.rs
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/fireemu-adapter-database/src/rest.rs')
          s = p.read_text()
          old = 'Additional diagnostics were truncated.'
          assert s.count(old) == 1
          p.write_text(s.replace(old, 'Additional diagnostics omitted.'))
          PY
          if cargo nextest run -p fireemu-adapter-database --test rules -E 'test(rules_put_marks_truncated_diagnostics)' > mutation-logs/no-marker.txt 2>&1; then exit 1; fi
          git restore crates/fireemu-adapter-database/src/rest.rs
      - name: upload mutation logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rtdb-rules-mutation-logs
          path: mutation-logs/
          if-no-files-found: error
