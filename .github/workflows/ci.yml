name: ci

# The documentation site has its own workflow (pages.yml). Site-only changes
# skip CI, except the docs pages: a test in crates/fireemu checks that their
# TOML and JSON configuration tabs agree.
on:
  pull_request:
    paths:
      - "**"
      - "!site/**"
      - "site/src/content/docs/**"
  push:
    branches: [main]
    paths:
      - "**"
      - "!site/**"
      - "site/src/content/docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CARGO_TARGET_DIR: target/normal
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - name: the pinned toolchain is the one in use
        run: rustc --version | tee /dev/stderr | grep -q "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: pr-normal
          workspaces: . -> target/normal
          cache-bin: "false"
          save-if: "false"
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2
        with:
          tool: cargo-deny
      - name: CI workflow topology and cache ownership
        run: ruby scripts/ci-workflow-contract.rb
      - name: Kani workflow contract
        run: ruby scripts/kani-ci-contract.test.rb
      # txn04-replay replaced a stored binary digest; this keeps it unskippable and failing the run on failure.
      - name: Txn-04 replay job contract
        run: ruby scripts/txn04-replay-contract.test.rb
      - name: heavy-verification workflow contract and helpers
        run: |
          ruby scripts/heavy-verification-contract.rb
          ruby scripts/heavy-verification-contract.test.rb
          python3 -m unittest discover -s tools/ci -p 'test_*.py'
          shellcheck tools/ci/heavy-run.sh tools/ci/heavy-run.test.sh scripts/heavy-verification-plan.test.sh tools/ci/nextest-private-tmpdir.sh
          tools/ci/heavy-run.test.sh
          scripts/heavy-verification-plan.test.sh
      - name: App Check fixture close ordering
        run: python3 crates/fireemu-adapter-functions/tests/test_fake_admin_runner_close.py
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: docs
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: cargo deny
        run: cargo deny check
      - name: core crates have zero external normal dependencies
        run: scripts/check-core-deps.sh
      - name: Cargo session isolation contract
        run: env -u CARGO_TARGET_DIR scripts/cargo-session.test.sh

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CARGO_TARGET_DIR: target/normal
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: the pinned toolchain is the one in use
        run: rustc --version | tee /dev/stderr | grep -q "$(sed -n 's/^channel = \"\(.*\)\"/\1/p' rust-toolchain.toml)"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: pr-normal
          workspaces: . -> target/normal
          cache-bin: "false"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2
        with:
          tool: cargo-nextest@0.9.143
      # The Functions runtime tests load the pinned real firebase-functions SDK from the conformance
      # install (crates/fireemu-adapter-functions/tests/runtime.rs, FE_SOURCE_SDK_ROOT overrides it).
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: "10.32.1"
      - name: the pinned real SDK for the Functions runtime tests
        run: pnpm -C conformance install --frozen-lockfile
      - name: tests (profile pr, retries 0)
        run: cargo nextest run --workspace --profile pr
      - name: RTDB rules route refuses a real non-loopback peer
        env:
          FIREEMU_REQUIRE_NON_LOOPBACK_TEST: "1"
        run: cargo nextest run -p fireemu-adapter-database --test server --profile pr --no-capture -E 'test(the_rules_route_answers_loopback_peers_only_however_its_path_is_written)'
      - name: limit catalog matches generated constants
        run: cargo run -p limit-catalog-gen -- check
      - name: requirement / mutant / loom traceability
        run: cargo run -p traceability-check
      - name: compatibility contract, manifest and public claim
        run: cargo run -p compat-check
      - name: canonical config schema and examples
        run: cargo run -p config-schema-check

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: the pinned toolchain is the one in use
        run: rustc --version | tee /dev/stderr | grep -q "$(sed -n 's/^channel = \"\(.*\)\"/\1/p' rust-toolchain.toml)"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        env:
          RUSTFLAGS: --cfg loom -D warnings
        with:
          shared-key: pr-loom
          workspaces: . -> target/loom
          cache-bin: "false"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: generated protobuf code matches vendored protos
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          cargo run -p proto-gen -- check
        env:
          CARGO_TARGET_DIR: target/verify
      - name: loom scenarios
        run: cargo test -p fireemu-verification-loom --release --target-dir target/loom
        env:
          RUSTFLAGS: --cfg loom -D warnings

  pr:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: target/minimal
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The selftest verifies harness lineage, which needs the history.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: pr-minimal
          workspaces: . -> target/minimal
          cache-bin: "false"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: install frozen conformance dependencies
        run: pnpm -C conformance install --frozen-lockfile
      # The federation fixtures' tests need the req validity flags of OpenSSL 3.4.
      - name: pinned OpenSSL for the frozen federation certificate fixtures
        run: |
          sh npm/scripts/install-federation-openssl.sh "$RUNNER_TEMP/fireemu-federation-openssl"
          echo "$RUNNER_TEMP/fireemu-federation-openssl/bin" >> "$GITHUB_PATH"
          echo "FIREEMU_FEDERATION_OPENSSL_DIR=$RUNNER_TEMP/fireemu-federation-openssl/bin" >> "$GITHUB_ENV"
      - name: conformance selftest
        run: pnpm -C conformance selftest
      - name: CI workflow cost contract
        run: ruby scripts/ci-workflow-contract.rb
      - name: fmt
        run: cargo fmt --all --check
      - name: compile every target
        run: cargo check --workspace --all-targets

  # The platforms fireemu publishes binaries for, so a change that only breaks one of them is
  # caught before a tag is cut rather than during a release. Every job in this workflow runs on
  # pull requests, on pushes to main and on demand; the `pr` job is the quick format-and-compile
  # status, and runtime tests run here and in the `lint`, `test` and `verify` jobs, and locally
  # through scripts/local-regression-gate (docs/development.md).
  #
  # Linux arm64 is not here: it shares this source with linux x64 and is exercised in the
  # release workflow, which builds and tests it on a native arm64 runner.
  platforms:
    name: tests (${{ matrix.os }}${{ matrix.shard && format(' {0}', matrix.shard) || '' }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            shard: 1/2
          - os: macos-latest
            shard: 2/2
          - os: windows-latest
            shard: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2
        with:
          tool: cargo-nextest@0.9.143
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.os }}
      # Cargo authority resolves the locked Linux projection with `--offline`. A host build does
      # not populate another target's registry sources, so fetch the whole locked graph first.
      - name: fetch locked dependency graph for offline authority checks
        if: runner.os == 'macOS'
        run: cargo fetch --locked
      # The Functions runtime tests load the pinned real firebase-functions SDK from the conformance
      # install (crates/fireemu-adapter-functions/tests/runtime.rs); Windows runs the lib tests only.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: runner.os == 'macOS'
        with:
          version: "10.32.1"
      - name: the pinned real SDK for the Functions runtime tests
        if: runner.os == 'macOS'
        run: pnpm -C conformance install --frozen-lockfile
      # The process-census integration suites shell out to `ps` and `kill` to prove that a
      # daemon leaves nothing running; they are POSIX-only by construction, so Windows runs the
      # in-crate unit tests. Making them portable is tracked in the distribution issue.
      # The Functions runner tests start a real Node and a real Python child, four at once, and they
      # are the first executions of those interpreters on a freshly provisioned runner. A first start
      # pages the image in from disk with an idle CPU: 4 to 22 s on 24 fresh VMs, and 60 s or more on two
      # runs of 2026-11-06, past the 60 s hello wait. Pay it here, where nothing has a deadline.
      - name: warm the interpreters the runner tests start
        if: runner.os == 'Windows'
        shell: bash
        timeout-minutes: 10
        run: |
          time node -e "for (const m of ['fs','http','net','crypto','path','os','child_process','readline','url','util','events']) require('node:' + m)"
          time python3 -c "import http.server, json, os, pathlib, socketserver, sys, threading, time"
      - name: tests
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            # The private Quint authority and its traceability CLI supervise Unix process groups;
            # production libraries remain in this native Windows test run.
            cargo nextest run --workspace --exclude fireemu-verification-quint --exclude traceability-check --lib --profile pr
            cargo nextest run -p fireemu --bin fireemu --test exec_windows --profile pr
          else
            cargo nextest run --workspace --profile pr --partition count:${{ matrix.shard }}
          fi

  # The Functions runner is Node code that shapes every event the emulator delivers. Its tests
  # (tools/runner-node/*.test.mjs, including the 44-frame production member-order test that guards the
  # Storage event shape) load the pinned real firebase-functions SDK from the conformance install.
  # The waits in the two process-level files follow the child's progress, not a fixed wall clock,
  # so a busy runner does not fail them (tools/runner-node/load-independent-wait.mjs).
  runner-node:
    name: runner node tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # The SDK inventory tests skip without the sdk-smoke install; here they must fail instead.
      FIREEMU_REQUIRE_SDK: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: "10.32.1"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: the pinned real SDK for the runner tests
        run: pnpm -C conformance install --frozen-lockfile
      # tools/sdk-smoke pins the same firebase-functions 7.3.2 as the conformance install; the SDK
      # inventory tests (docs/functions-export-inventory.md) read it from here.
      - name: the SDK fixture for the inventory tests
        run: npm ci --prefix tools/sdk-smoke --ignore-scripts
      - name: Functions runner Node tests
        run: node --test tools/runner-node/*.test.mjs

  # tools/sdk-smoke-database: the tests of the Realtime Database smokes and of the production recorders built
  # on them (the committed CV11 journal against its production fixture, the REST/CV07/CV11/rtdb-residual judges
  # and their near misses, the ADC preflight). They run offline against fakes: no Google endpoint, no
  # credential, no official emulator jar, no fireemu binary. One file (rtdb-residual-page.test.mjs) drives
  # headless Chromium against a stub SDK, so the browser is installed first and FIREEMU_REQUIRE_BROWSER makes
  # a browser that cannot start fail that file instead of skipping its ten tests.
  sdk-smoke-database:
    name: database smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FIREEMU_REQUIRE_BROWSER: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: the pinned SDKs for the database smoke tests
        run: npm ci --prefix tools/sdk-smoke-database --ignore-scripts
      - name: Chromium for the residual page tests
        run: npx --prefix tools/sdk-smoke-database playwright install --with-deps chromium
      - name: database smoke tests
        run: npm test --prefix tools/sdk-smoke-database

  # tools/sdk-smoke-python: the Python Admin SDK (firebase-admin, google-cloud-firestore) against a
  # fireemu built from this commit, under `fireemu exec` so the clients get the emulator hosts the
  # command really receives. ubuntu-24.04's system python3 is 3.12, so no setup action is needed; the
  # requirements are hash-locked. The suite runs under the default profile and under strict.
  sdk-smoke-python:
    # Bound cache tokens even when the Python SDK code under `fireemu exec` calls the cache API.
    cache-mode: read
    name: Python Admin SDK smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      # Keep the action-level save guard too, as sdk-latest.yml does.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: sdk-smoke-python
          save-if: "false"
      - name: build fireemu from this commit
        run: cargo build --locked -p fireemu
      - name: the pinned Python SDKs
        run: |
          set -eu
          python3 -c 'import sys; assert sys.version_info[:2] == (3, 12), sys.version'
          python3 -m venv "$RUNNER_TEMP/sdk-smoke-python"
          "$RUNNER_TEMP/sdk-smoke-python/bin/pip" install --require-hashes -r tools/sdk-smoke-python/requirements.txt
      - name: Python Admin SDK smoke (default profile)
        run: |
          target/debug/fireemu exec --project demo-app --hub-port 0 -- \
            "$RUNNER_TEMP/sdk-smoke-python/bin/python" -m pytest -p no:cacheprovider tools/sdk-smoke-python
      - name: Python Admin SDK smoke (strict profile)
        run: |
          target/debug/fireemu exec --config tools/sdk-smoke-python/fireemu.strict.json --project demo-app --hub-port 0 -- \
            "$RUNNER_TEMP/sdk-smoke-python/bin/python" -m pytest -p no:cacheprovider tools/sdk-smoke-python

  # The Txn-04 recorded comparison on this commit's binary. The committed record
  # (spec/compatibility/broad-runs/fs-transaction-expiry-retry-04-recorded-comparison-v1.json) binds
  # both production recordings, their projection and the strict superseded cases; this job builds
  # fireemu from the checkout exactly as the local regeneration did (debug, --locked, -p fireemu
  # --bin fireemu), replays the 13 cases in both profiles on loopback with the control clock, and
  # fails when any answer differs from production (strict: outside the superseded cases). It sends
  # no production request and reads no secret. The result names this commit and binary sha256.
  txn04-replay:
    name: Txn-04 replay (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: txn04-replay-${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: build fireemu from this commit
        run: cargo build --locked -p fireemu --bin fireemu
      - name: replay both profiles against the recorded production answers
        run: |
          uv run --project tools/compat-inventory --locked --python 3.12.13 \
            tools/compat-broad/fs-write-txn/txn04_current_replay.py \
            --binary target/debug/fireemu --dep-info target/debug/fireemu.d --out "$RUNNER_TEMP/txn04-replay"
      - name: keep the result
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: txn04-replay-${{ matrix.os }}
          path: ${{ runner.temp }}/txn04-replay/result.json
          if-no-files-found: error

  # tools/runner-python and tools/sdk-smoke-functions-python: the Python Functions runner with the real
  # firebase-functions SDK (hash-locked in the fixture) under a fireemu built from this commit. The
  # runner's own tests, the daemon's tests that start the real runner (they need the fixture's venv and
  # are `#[ignore]`d without it), and the end-to-end checks under `fireemu exec` in both profiles.
  # ubuntu-24.04's system python3 is 3.12, so no setup action is needed.
  functions-python:
    # Bound cache tokens even when Python code under `fireemu exec` calls the cache API.
    cache-mode: read
    name: Python Functions runner
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      # Keep the action-level save guard too, as sdk-latest.yml does.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: functions-python
          save-if: "false"
      - name: the pinned Python SDK in the fixture's virtual environment
        run: |
          set -eu
          python3 -c 'import sys; assert sys.version_info[:2] == (3, 12), sys.version'
          python3 -m venv tools/sdk-smoke-functions-python/venv
          tools/sdk-smoke-functions-python/venv/bin/pip install --require-hashes -r tools/sdk-smoke-functions-python/requirements.txt
      - name: the runner's tests with the real SDK
        run: tools/sdk-smoke-functions-python/venv/bin/python -m pytest -p no:cacheprovider tools/runner-python/tests
      - name: the daemon with the real Python runner
        run: cargo test --locked -p fireemu --test functions_python -- --include-ignored

  # tools/sdk-smoke-go: the Go Admin SDK (firebase.google.com/go/v4 with cloud.google.com/go/firestore
  # and cloud.google.com/go/storage, versions locked in go.mod/go.sum) against a fireemu built from this
  # commit, under `fireemu exec` with the defaults and with the strict exact configuration. The smoke's
  # guard refuses to start unless every emulator host variable those SDKs read names a loopback host,
  # and its offline tests run first. No credential is used: the SDKs run in their emulator modes.
  sdk-smoke-go:
    name: Go Admin SDK smoke
    # The job runs third-party SDK code: bound its cache tokens to reads.
    cache-mode: read
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      # setup-go reads the exact `toolchain` line of go.mod and exports GOTOOLCHAIN=local.
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: tools/sdk-smoke-go/go.mod
          cache: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: sdk-smoke-go
          save-if: "false"
      - name: build fireemu from this commit
        run: cargo build --locked -p fireemu
      - name: Go smoke format, vet and offline guard tests
        run: |
          set -eu
          cd tools/sdk-smoke-go
          go mod verify
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...
          go build -o "$RUNNER_TEMP/sdk-smoke-go" .
      - name: Go Admin SDK smoke (default configuration)
        id: go-default
        run: target/debug/fireemu exec --project demo-app --hub-port 0 -- "$RUNNER_TEMP/sdk-smoke-go"
      # A failure of the default run must not hide the strict run.
      - name: Go Admin SDK smoke (strict exact configuration)
        if: ${{ !cancelled() && steps.go-default.conclusion != 'skipped' }}
        run: target/debug/fireemu exec --config tools/sdk-smoke-go/fireemu.strict.json --project demo-app --hub-port 0 -- "$RUNNER_TEMP/sdk-smoke-go"

  # The packages a release would publish, built from this commit and installed the way a user
  # installs them: offline, from the packed tarballs, under a path with a space and non-ASCII
  # characters, through a symlink and from a read-only directory. `pack-local.mjs` is what a
  # developer runs before a tag; running it here keeps the packaging from rotting between tags.
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: "10.32.1"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: package
      - run: pnpm -C ui install --frozen-lockfile
      - run: pnpm -C ui build
      - run: node --test npm/scripts/distribution-licenses.test.mjs
      - run: node --test npm/scripts/prepare-launcher.test.mjs
      - run: node --test npm/scripts/release-metadata.test.mjs
      - run: node --test npm/scripts/changelog-section.test.mjs
      - run: node --test npm/scripts/control.test.mjs npm/scripts/testing-snapshot.test.mjs npm/scripts/testing-config.test.mjs npm/scripts/testing-worlds.test.mjs
      - run: node --test npm/scripts/types-consumer.test.mjs
      - run: cargo build --release --locked -p fireemu
      - run: node npm/scripts/pack-local.mjs
      - run: node npm/scripts/verify-install.mjs --dist npm/dist

  # Emulator UI gate (UI-PARITY-05): unit tests, lint, format, the adapter-ui browser-policy
  # tests, and the Playwright E2E (parity flows plus the security suite -- CSP, DNS-rebinding
  # via Host/Origin, download disposition, and bounded reads) against a real daemon.
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: "10.32.1"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: install UI dependencies
        run: pnpm -C ui install --frozen-lockfile
      - name: install Functions fixture dependencies
        run: npm ci --prefix tools/sdk-smoke --ignore-scripts
      - name: lint
        run: pnpm -C ui lint
      - name: format
        run: pnpm -C ui fmt:check
      - name: unit tests
        run: pnpm -C ui test
      - name: build the UI bundle
        run: pnpm -C ui build
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2
        with:
          tool: cargo-nextest@0.9.143
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ui
      - name: adapter-ui tests (browser policy, streams, downloads)
        run: cargo nextest run -p fireemu-adapter-ui
      - name: build the daemon with the UI embedded
        run: cargo build --release -p fireemu
      - name: install the Playwright browser
        run: pnpm -C ui exec playwright install --with-deps chromium
      - name: browser E2E (parity flows and the security suite)
        run: pnpm -C ui e2e
