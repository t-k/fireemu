#:schema https://raw.githubusercontent.com/t-k/fireemu/main/spec/config/fireemu.schema.json
schemaVersion = 1
profile = "strict"

[limits]
catalog = "firestore-standard-2026-08-25"
queryCatalog = "firestore-standard-query-2026-08-25"
rulesCatalog = "firebase-rules-2026-08-25"

[firestore]
edition = "standard"
apiMode = "native"

[rules]
executionMode = "admin-bypass"

[[auth.providers.oidc]]
name = "oidc.fixture"
enabled = true
clientId = "local-client"
issuer = "https://issuer.test"

[[auth.providers.saml]]
name = "saml.fixture"
enabled = true

[auth.providers.saml.idpConfig]
idpEntityId = "idp"
ssoUrl = "https://sso.test"

[[auth.providers.saml.idpConfig.idpCertificates]]
x509Certificate = "PUBLIC-TEST-CERTIFICATE"

[auth.providers.saml.spConfig]
spEntityId = "sp"
callbackUri = "https://callback.test"
