name: v041 native positive private candidate
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Frozen source 40-hex SHA
        required: true
        type: string
      binary_run_id:
        description: Run ID containing v041-build-custody
        required: true
        type: string
      version:
        description: Expected workspace version
        default: 0.41.0
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  native-positive:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      EXPECTED_SOURCE: ${{ inputs.source_sha }}
      EXPECTED_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: v041-build-custody
          run-id: ${{ inputs.binary_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/v041-custody
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.32.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.14.0
      - run: pnpm -C conformance install --frozen-lockfile
      - name: Materialize private driver and child
        run: |
          echo  | base64 -d > "$RUNNER_TEMP/native-ready-driver.sh"
          echo  | base64 -d > "$RUNNER_TEMP/native-ready-child.mjs"
      - name: Run eight sessions with isolated owned processes
        env:
          CUSTODY: ${{ runner.temp }}/v041-custody
          OUT: ${{ runner.temp }}/v041-native-positive
        shell: bash
        run: |
          chmod +x "$CUSTODY/fireemu"
          mkdir -p "$OUT"
          sudo systemd-run --scope --quiet -p MemoryMax=6442450944 -p MemorySwapMax=0 \
            unshare --net --pid --fork --mount-proc --kill-child -- \
            sh -c 'ip link set lo up; exec setpriv --reuid="$1" --regid="$2" --init-groups -- env PATH="$3" HOME="$4" EXPECTED_SOURCE="$5" EXPECTED_VERSION="$6" CUSTODY="$7" OUT="$8" NATIVE_CHILD="$9" bash "${10}"' \
            sh "$(id -u)" "$(id -g)" "$PATH" "$HOME" "$EXPECTED_SOURCE" "$EXPECTED_VERSION" "$CUSTODY" "$OUT" "$RUNNER_TEMP/native-ready-child.mjs" "$RUNNER_TEMP/native-ready-driver.sh"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v041-native-positive-raw
          path: ${{ runner.temp }}/v041-native-positive
          if-no-files-found: warn
