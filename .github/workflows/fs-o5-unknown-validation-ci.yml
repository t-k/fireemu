name: fs-o5-unknown-validation-ci
on:
  push:
    branches: [work/fs-o5-unknown-validation-ci]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 35a25dae1c329d8f86a15551649e98c174cffc6c
          fetch-depth: 0
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177
        with:
          tool: cargo-nextest@0.9.143
      - run: |
          test "$(git rev-parse HEAD)" = 35a25dae1c329d8f86a15551649e98c174cffc6c
          cargo nextest run -p fireemu-adapter-grpc --profile pr --locked -E 'test(unknown_add_fields_precedes_later_stage_arity_on_both_transports)'
