name: compatibility-inventory

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  feature-inventory-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install the repository-pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: compatibility-inventory
      - name: Validate requirement references and generated feature tables
        run: cargo run --locked -p compat-check
      - name: Test the feature inventory integrity gate
        run: cargo test --locked -p compat-check
  offline-acquisition-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install uv
        run: python3 -m pip install uv==0.11.28
      - name: Check immutable historical tools, observations and approvals
        run: uv run --project tools/compat-inventory --locked --python 3.12 tools/compat-history/history.py --check
      - name: Test current historical isolation and session revision 2 contracts
        run: uv run --project tools/compat-inventory --locked --python 3.12 -m pytest tools/compat-history tools/auth-session-v2 tools/auth-session-continuity -q
      - name: Check session revision 2 candidate observations
        run: uv run --project tools/compat-inventory --locked --python 3.12 tools/publish-auth-session-v2.py --check
      - name: Check subject-bound session revision 2 human approval
        run: uv run --project tools/compat-inventory --locked --python 3.12 tools/auth-session-v2-approval.py --check
      - name: Check no-password-change session continuity candidate
        run: uv run --project tools/compat-inventory --locked --python 3.12 tools/publish-auth-session-continuity.py --check
