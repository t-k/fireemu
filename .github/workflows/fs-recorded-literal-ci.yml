name: fs-recorded-literal-ci
on:
  push:
    branches: [work/fs-recorded-literal-ci]
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 28cd5c44eacdee151035e776f648d6e4db661dc2
          fetch-depth: 0
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177
        with:
          tool: cargo-nextest@0.9.143
      - name: Measure in-process corpus answers
        env:
          REGENERATE_O5_DEBT: /tmp/literal-o5-debt.json
          DUMP_REPLAY_DIFFS: /tmp/literal-o5-diff
        run: |
          test "$(git rev-parse HEAD)" = 28cd5c44eacdee151035e776f648d6e4db661dc2
          cargo nextest run -p fireemu-adapter-grpc --profile pr --locked -E 'test(the_pipeline_corpus_replays_as_production_answered)'
      - name: Preserve actual corpus answers
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: literal-o5-actual
          path: /tmp/literal-o5-*
          if-no-files-found: warn
