name: v041 Quint seven-model private candidate
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Version-bumped source commit SHA
        required: true
        type: string
      version:
        description: Expected workspace version
        default: 0.41.0
        required: true
        type: string
permissions:
  contents: read
jobs:
  quint-generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      EXPECTED_SOURCE: ${{ inputs.source_sha }}
      EXPECTED_VERSION: ${{ inputs.version }}
      CARGO_BUILD_JOBS: 1
      RUSTC_WRAPPER: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact input and clean source
        shell: bash
        run: |
          [[ "$EXPECTED_SOURCE" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          test -z "$(git status --porcelain --untracked-files=no)"
          test "$EXPECTED_VERSION" = 0.41.0
          python3 -c 'import os,tomllib; assert tomllib.load(open("Cargo.toml","rb"))["workspace"]["package"]["version"] == os.environ["EXPECTED_VERSION"]'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: install protected verification JDK
        shell: bash
        run: |
          set -euo pipefail
          java_path="$(readlink -f "$(command -v java)")"
          source_jdk="$(dirname "$(dirname "$java_path")")"
          test "$source_jdk" != / && test -x "$source_jdk/bin/java"
          test -x "$source_jdk/bin/javac" && test -x "$source_jdk/bin/jar"

          protected_jdk="$(sudo mktemp -d /usr/lib/fireemu-quint-jdk.XXXXXX)"
          # Dereference internal JDK symlinks so every executable remains inside the protected
          # copy and no permissive symlink mode is mistaken for an executable permission.
          sudo cp -aL "$source_jdk"/. "$protected_jdk"/
          sudo chown -R root:root "$protected_jdk"
          sudo chmod -R go-w "$protected_jdk"
          sudo chmod 0755 "$protected_jdk"

          for executable in java javac jar; do
            path="$protected_jdk/bin/$executable"
            test -x "$path"
            resolved="$(readlink -f "$path")"
            test "$resolved" = "$path"
          done

          # trusted_path() rejects any non-root-owned or caller-writable ancestor.
          test "$(find "$protected_jdk" -xdev \( ! -user root -o -perm /022 \) -print -quit)" = ""
          for executable in java javac jar; do
            path="$protected_jdk/bin/$executable"
            parent="$path"
            while true; do
              test "$(stat -c '%u' "$parent")" = 0
              mode="$(stat -c '%a' "$parent")"
              test "$((8#$mode & 022))" = 0
              test "$parent" != / || break
              parent="$(dirname "$parent")"
            done
          done

          echo "JAVA_HOME=$protected_jdk" >> "$GITHUB_ENV"
          echo "$protected_jdk/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          components: rustfmt, clippy
      - name: Verify pinned Rust toolchain
        run: rustc --version | tee /dev/stderr | grep -q "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.32.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: verification/quint/pnpm-lock.yaml
      - run: pnpm -C verification/quint install --frozen-lockfile
      - name: Install verified Apalache backend
        run: QUINT_HOME="$RUNNER_TEMP/quint-home" verification/quint/bin/install-apalache
      - name: Fetch locked Cargo dependencies
        run: cargo fetch --locked
      - name: Refresh seven and verify all fifteen models in bounded scope
        env:
          OUT: ${{ runner.temp }}/v041-quint-output
          WT: ${{ github.workspace }}
          CARGO_TARGET_DIR: ${{ runner.temp }}/v041-quint-target
          QUINT_REAL_BIN: ${{ github.workspace }}/verification/quint/node_modules/.bin/quint
        shell: bash
        run: |
          set -euo pipefail
          if test -e "$OUT"; then echo 'Output path already exists' >&2; exit 1; fi
          mkdir -p "$OUT"
          echo  | base64 -d > "$OUT/generate.sh"
          export PATH="$WT/verification/quint/bin:$JAVA_HOME/bin:$PATH"
          # The log belongs to the runner user; redirection must occur before sudo.
          # shellcheck disable=SC2024
          sudo systemd-run --scope --quiet -p MemoryMax=6442450944 -p MemorySwapMax=0 \
            setpriv --reuid="$(id -u)" --regid="$(id -g)" --init-groups -- \
            env PATH="$PATH" HOME="$HOME" WT="$WT" EXPECTED_SOURCE="$EXPECTED_SOURCE" RUNNER_TEMP="$RUNNER_TEMP" OUT="$OUT" \
            CARGO_TARGET_DIR="$CARGO_TARGET_DIR" CARGO_BUILD_JOBS=1 RUSTC_WRAPPER= JAVA_HOME="$JAVA_HOME" QUINT_REAL_BIN="$QUINT_REAL_BIN" \
            bash "$OUT/generate.sh" > "$OUT/generate.log" 2>&1
      - name: Preserve available generated evidence
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/v041-quint-output/partial-evidence"
          if test -d verification/quint/evidence; then cp -a verification/quint/evidence/. "$RUNNER_TEMP/v041-quint-output/partial-evidence/"; fi
          git status --short > "$RUNNER_TEMP/v041-quint-output/failure-status.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v041-quint-seven-generation
          path: ${{ runner.temp }}/v041-quint-output
          if-no-files-found: warn
