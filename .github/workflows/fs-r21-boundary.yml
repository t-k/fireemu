name: fs-r21 local transport boundary
on:
  push:
    branches: [work/fs-r21-refusals-ci]
    paths: [.github/workflows/fs-r21-boundary.yml]
permissions:
  contents: read
  actions: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 3f47be5f8363e60403d05ebae7f959f9e490a8e8
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: .ci-helper
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: v041-build-custody
          path: ${{ runner.temp }}/custody
          run-id: 41169742924
          github-token: ${{ github.token }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.32.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.14.0
      - run: pnpm -C conformance install --frozen-lockfile
      - name: Replay original requests over both local transports
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 3f47be5f8363e60403d05ebae7f959f9e490a8e8
          test "$(cat "$RUNNER_TEMP/custody/source.sha")" = "$(git rev-parse HEAD)"
          test "$(sha256sum "$RUNNER_TEMP/custody/fireemu" | cut -d' ' -f1)" = "$(cat "$RUNNER_TEMP/custody/binary.sha")"
          chmod +x "$RUNNER_TEMP/custody/fireemu"
          python3 .ci-helper/.github/temporary/prepare_r21_subset.py
          mkdir "$RUNNER_TEMP/r21-boundary"
          cp /tmp/r21-programs.json "$RUNNER_TEMP/r21-boundary/programs.json"
          cp "$RUNNER_TEMP/custody/source.sha" "$RUNNER_TEMP/custody/binary.sha" "$RUNNER_TEMP/r21-boundary/"
          sha256sum conformance/fs-ent-pipeline-requests.json conformance/fs-ent-pipeline-production.json /tmp/r21-programs.json > "$RUNNER_TEMP/r21-boundary/input.sha256"
          project=$(node --input-type=module -e "import { SANDBOX_PROJECT } from \"./conformance/src/fs-ent-pipeline/harness.mjs\"; process.stdout.write(SANDBOX_PROJECT)")
          for profile in strict emulator; do
            if test "$profile" = strict; then config=conformance/fs-ent-pipeline.fireemu.json; else config=conformance/fs-ent-pipeline.emulator.fireemu.json; fi
            sudo systemd-run --scope --quiet -p MemoryMax=6442450944 -p MemorySwapMax=0 unshare --net --pid --fork --mount-proc --kill-child -- sh -c '
              ip link set lo up
              test "$$" = 1
              cg=$(cut -d: -f3 /proc/self/cgroup)
              cat "/sys/fs/cgroup${cg}/memory.max" > "$5/$6.memory.max"
              cat "/sys/fs/cgroup${cg}/memory.swap.max" > "$5/$6.memory.swap.max"
              test "$(cat "$5/$6.memory.max")" = 6442450944
              test "$(cat "$5/$6.memory.swap.max")" = 0
              readlink /proc/self/ns/net > "$5/$6.netns"
              exec setpriv --reuid="$1" --regid="$2" --init-groups -- env -u GOOGLE_APPLICATION_CREDENTIALS PATH="$3" HOME="$4" FIREEMU_SANDBOX_LANE=fs-ent-pipeline FS_QUERY_INDEX_IN=/tmp/r21-programs.json FS_QUERY_INDEX_OUT="$5/$6.json" FS_QUERY_INDEX_RUN="$7" "$8" exec --config "$9" --project "${10}" --only firestore --firestore-port 0 --http-port 0 --storage-port 0 --ui-port 0 --hub-port 0 --logging-port 0 --firebase-json conformance/fs-ent-pipeline.firebase.json -- node conformance/src/fs-query-index/run.mjs session-local
            ' sh "$(id -u)" "$(id -g)" "$PATH" "$HOME" "$RUNNER_TEMP/r21-boundary" "$profile" "$GITHUB_RUN_ID" "$RUNNER_TEMP/custody/fireemu" "$config" "$project" > "$RUNNER_TEMP/r21-boundary/$profile.log" 2>&1
          done
          test "$(sha256sum "$RUNNER_TEMP/custody/fireemu" | cut -d' ' -f1)" = "$(cat "$RUNNER_TEMP/custody/binary.sha")"
          test "$(git rev-parse HEAD)" = 3f47be5f8363e60403d05ebae7f959f9e490a8e8
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: fs-r21-boundary-v2
          path: ${{ runner.temp }}/r21-boundary
          if-no-files-found: warn
