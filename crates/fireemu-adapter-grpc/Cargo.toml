[package]
name = "fireemu-adapter-grpc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "gRPC shell: Firestore v1 wire decoding, strict gateway validation, optional upstream proxy"

[dependencies]
fireemu-adapter-support = { path = "../fireemu-adapter-support" }
fireemu-core-types = { path = "../fireemu-core-types" }
fireemu-core-limits = { path = "../fireemu-core-limits" }
fireemu-core-firestore = { path = "../fireemu-core-firestore" }
fireemu-core-session = { path = "../fireemu-core-session" }
fireemu-core-rules = { path = "../fireemu-core-rules" }
fireemu-core-auth = { path = "../fireemu-core-auth" }
fireemu-core-app-check = { path = "../fireemu-core-app-check" }
fireemu-proto-firestore = { path = "../fireemu-proto-firestore" }
prost-types = "0.13"
tonic = { version = "0.13", features = ["transport", "codegen", "prost"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "sync"] }

tokio-stream = "0.1"
serde_json.workspace = true
hyper = { version = "1", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "server"] }
http-body-util = "0.1"
bytes = "1"

[dev-dependencies]
tokio-stream = { version = "0.1", features = ["net"] }
proptest.workspace = true

[lints]
workspace = true

[[bench]]
name = "read_concurrency"
harness = false
