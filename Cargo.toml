[workspace]
resolver = "2"
members = [
    "crates/fireemu-core-types",
    "crates/fireemu-core-limits",
    "crates/fireemu-core-session",
    "crates/fireemu-core-events",
    "crates/fireemu-core-firestore",
    "crates/fireemu-core-rules",
    "crates/fireemu-core-auth",
    "crates/fireemu-core-app-check",
    "crates/fireemu-core-storage",
    "crates/fireemu-core-functions",
    "crates/fireemu-core-pubsub",
    "crates/fireemu-core-export",
    "crates/fireemu-export-publication",
    "crates/fireemu-proto-firestore",
    "crates/fireemu-proto-pubsub",
    "crates/fireemu-adapter-support",
    "crates/fireemu-adapter-grpc",
    "crates/fireemu-adapter-http",
    "crates/fireemu-adapter-functions",
    "crates/fireemu-adapter-pubsub",
    "crates/fireemu-adapter-logging",
    "crates/fireemu-adapter-ui",
    "crates/fireemu",
    "tools/limit-catalog-gen",
    "tools/traceability-check",
    "tools/compat-check",
    "tools/config-schema-check",
    "tools/proto-gen",
    "verification/loom",
    "verification/kani",
    "verification/property",
    "verification/quint",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/t-k/fireemu"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)", "cfg(kani)"] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic lints we intentionally relax.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[workspace.dependencies]
proptest = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

# Development builds keep only line tables for workspace crates and no debuginfo for
# dependencies: backtraces and panics still name the file and line in our own code, while the
# object files and the 120-odd test binaries the workspace links shrink by most of their size.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Full debuginfo everywhere, for a debugger session that has to step into dependencies. It is
# a separate profile (`cargo test --profile debugging`) so that switching to it and back never
# invalidates the `dev` artifacts.
[profile.debugging]
inherits = "dev"
debug = true

[profile.debugging.package."*"]
debug = true

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
