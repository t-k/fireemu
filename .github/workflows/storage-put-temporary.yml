name: Temporary Storage PUT evidence
on:
  pull_request:
permissions:
  contents: read
jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177
        with:
          tool: cargo-nextest@0.9.143
      - run: cargo nextest run -p fireemu-adapter-http --test storage -E 'test(signed_xml_put)'
      - run: cargo nextest run -p fireemu-adapter-http --profile pr
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.32.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: pnpm -C conformance install --frozen-lockfile
      - run: cargo build -p fireemu --locked
      - run: target/debug/fireemu exec --project demo-signed-put --only storage --storage-port 0 --hub-port 0 -- node conformance/src/storage-signed-put-smoke.mjs
