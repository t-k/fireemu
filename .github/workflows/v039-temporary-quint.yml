name: v039 candidate seven-model evidence

on:
  push:
    branches: [work/v039-quint-ci]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  quint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - name: install protected verification JDK
        shell: bash
        run: |
          set -euo pipefail
          java_path="$(readlink -f "$(command -v java)")"
          source_jdk="$(dirname "$(dirname "$java_path")")"
          test "$source_jdk" != / && test -x "$source_jdk/bin/java"
          test -x "$source_jdk/bin/javac" && test -x "$source_jdk/bin/jar"

          protected_jdk="$(sudo mktemp -d /usr/lib/fireemu-quint-jdk.XXXXXX)"
          # Dereference internal JDK symlinks so every executable remains inside the protected
          # copy and no permissive symlink mode is mistaken for an executable permission.
          sudo cp -aL "$source_jdk"/. "$protected_jdk"/
          sudo chown -R root:root "$protected_jdk"
          sudo chmod -R go-w "$protected_jdk"
          sudo chmod 0755 "$protected_jdk"

          for executable in java javac jar; do
            path="$protected_jdk/bin/$executable"
            test -x "$path"
            resolved="$(readlink -f "$path")"
            test "$resolved" = "$path"
          done

          # trusted_path() rejects any non-root-owned or caller-writable ancestor.
          test "$(find "$protected_jdk" -xdev \( ! -user root -o -perm /022 \) -print -quit)" = ""
          for executable in java javac jar; do
            path="$protected_jdk/bin/$executable"
            parent="$path"
            while true; do
              test "$(stat -c '%u' "$parent")" = 0
              mode="$(stat -c '%a' "$parent")"
              test "$((8#$mode & 022))" = 0
              test "$parent" != / || break
              parent="$(dirname "$parent")"
            done
          done

          echo "JAVA_HOME=$protected_jdk" >> "$GITHUB_ENV"
          echo "$protected_jdk/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - name: verify pinned Rust toolchain
        run: rustc --version | tee /dev/stderr | grep -q "$(sed -n 's/^channel = \"\(.*\)\"/\1/p' rust-toolchain.toml)"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: "10.32.1"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: verification/quint/pnpm-lock.yaml
      - name: install pinned Quint
        run: pnpm -C verification/quint install --frozen-lockfile
      - name: install verified Apalache backend
        run: |
          quint_home="$RUNNER_TEMP/quint-home"
          QUINT_HOME="$quint_home" verification/quint/bin/install-apalache
          echo "QUINT_HOME=$quint_home" >> "$GITHUB_ENV"
      - name: configure guarded Quint path
        run: |
          echo "QUINT_REAL_BIN=$GITHUB_WORKSPACE/verification/quint/node_modules/.bin/quint" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/verification/quint/bin" >> "$GITHUB_PATH"
      - name: fetch locked workspace dependencies for offline authority checks
        run: cargo fetch --locked
      - name: Select immutable candidate source
        run: |
          set -euo pipefail
          git checkout --detach c31f5eb8c861d0ea3f909bfdbf4168b8d4cae861
          test "$(git rev-parse HEAD)" = c31f5eb8c861d0ea3f909bfdbf4168b8d4cae861
          test -z "$(git status --porcelain)"
      - name: Recompute and verify seven models
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v039-quint"
          for model in AwaitIdle FirestoreListenRefresh CompatibilitySelection AtomicExportPublication AtomicCommitOutbox LimitRejection TransactionConditionalLock; do
            cargo run --locked -p fireemu-verification-quint -- mutate-model --model "$model" --evidence "$RUNNER_TEMP/v039-quint/$model.json"
            cargo run --locked -p fireemu-verification-quint -- verify-evidence --model "$model" --evidence "$RUNNER_TEMP/v039-quint/$model.json"
          done
          git rev-parse HEAD > "$RUNNER_TEMP/v039-quint/source.txt"
          (cd "$RUNNER_TEMP/v039-quint" && sha256sum ./*.json source.txt > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v039-seven-model-evidence
          path: ${{ runner.temp }}/v039-quint
          if-no-files-found: error
  r21:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      RUSTC_WRAPPER: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Select immutable candidate source
        run: |
          set -euo pipefail
          git checkout --detach c31f5eb8c861d0ea3f909bfdbf4168b8d4cae861
          test "$(git rev-parse HEAD)" = c31f5eb8c861d0ea3f909bfdbf4168b8d4cae861
          test -z "$(git status --porcelain)"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: '10.32.1'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install locked conformance dependencies
        run: pnpm -C conformance install --frozen-lockfile
      - name: Build source-bound binary
        run: |
          set -euo pipefail
          cargo build --manifest-path "$GITHUB_WORKSPACE/Cargo.toml" --locked -p fireemu --bin fireemu
          test -z "$(git status --porcelain)"
          sha256sum target/debug/fireemu > "$RUNNER_TEMP/r21-binary.sha256"
      - name: Replay R21 with loopback-only networking
        run: |
          set -euo pipefail
          set +e
          # shellcheck disable=SC2024
          sudo unshare --net -- env PATH="$PATH" HOME="$HOME" FIREEMU_BIN="$GITHUB_WORKSPACE/target/debug/fireemu" FIREEMU_SANDBOX_LANE=fs-ent-pipeline \
            sh -c 'ip link set lo up && exec setpriv --reuid="$1" --regid="$2" --init-groups -- node conformance/src/fs-query-index/run.mjs check' \
            sh "$(id -u)" "$(id -g)" > "$RUNNER_TEMP/r21-check.log" 2>&1
          rc=$?
          set -e
          test "$rc" = 1
          FIREEMU_SANDBOX_LANE=fs-ent-pipeline node conformance/src/fs-query-index/run.mjs export-comparison "$RUNNER_TEMP/r21-actual.json"
          node --input-type=module -e 'import fs from "node:fs";import {isDeepStrictEqual} from "node:util";const a=JSON.parse(fs.readFileSync(process.argv[1])),b=JSON.parse(fs.readFileSync(process.argv[2]));for(const k of ["kind","fixtureSha256","summary","rows"])if(!isDeepStrictEqual(a[k],b[k]))throw Error("mismatch "+k)' conformance/fs-ent-pipeline-release-v039.json "$RUNNER_TEMP/r21-actual.json"
          sha256sum "$RUNNER_TEMP/r21-actual.json" "$RUNNER_TEMP/r21-check.log" > "$RUNNER_TEMP/r21-output.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v039-r21-validation
          path: |
            ${{ runner.temp }}/r21-binary.sha256
            ${{ runner.temp }}/r21-actual.json
            ${{ runner.temp }}/r21-check.log
            ${{ runner.temp }}/r21-output.sha256
          if-no-files-found: error
