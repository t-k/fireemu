name: fs-value-shapes-ci
on:
  push:
    branches: [work/fs-value-shapes-ci]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 8e1f2a37a9d3c1f5505ce394b3e1f274cf67bda8
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177
        with:
          tool: cargo-nextest@0.9.143
      - run: |
          test "$(git rev-parse HEAD)" = 8e1f2a37a9d3c1f5505ce394b3e1f274cf67bda8
          cargo nextest run -p fireemu-adapter-grpc --profile pr --locked
