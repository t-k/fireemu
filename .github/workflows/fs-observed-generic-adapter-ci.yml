name: fs-observed-generic-adapter-ci
on:
  push:
    branches: [work/fs-observed-generic-adapter-ci]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 99660651b2d15ac74491524984af7ee26c39835a
          fetch-depth: 0
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177
        with:
          tool: cargo-nextest@0.9.143
      - name: Run generic adapter tests
        run: |
          test "$(git rev-parse HEAD)" = 99660651b2d15ac74491524984af7ee26c39835a
          cargo nextest run -p fireemu-adapter-grpc --profile pr --locked -E 'test(captured_generic_expressions_preserve_typed_results) | test(autogen_document_id_uses_request_runtime) | test(coalesce_skips_failing_constant_but_validates_static_errors)'
      - name: Clippy affected crates
        if: always()
        run: cargo clippy -p fireemu-core-firestore -p fireemu-adapter-grpc --all-targets --locked -- -D warnings
