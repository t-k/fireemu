name: fs-o5-recorded-validation-ci
on:
  push:
    branches: [work/fs-o5-recorded-validation-ci]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 1c345818302a706e9236743901049837df4bfa95
          fetch-depth: 0
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177
        with:
          tool: cargo-nextest@0.9.143
      - name: Run arity and controls
        run: |
          test "$(git rev-parse HEAD)" = 1c345818302a706e9236743901049837df4bfa95
          cargo nextest run -p fireemu-core-firestore -p fireemu-adapter-grpc --profile pr --locked -E 'test(recorded_registered_function_arities_match_both_transports) | test(registered_function_arity_unrecorded_shapes_remain_refused) | test(captured_numeric_scalar_expressions_preserve_integer_results) | test(captured_generic_expressions_preserve_typed_results) | test(arity_review_pict_rows) | test(at_least_arity_is_bounded) | test(numeric_scalar_unobserved_arity_keeps_profile_boundary)'
      - name: Clippy affected crates
        if: always()
        run: cargo clippy -p fireemu-core-firestore -p fireemu-adapter-grpc --all-targets --locked -- -D warnings
