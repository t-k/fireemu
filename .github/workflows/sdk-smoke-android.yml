name: sdk-smoke-android

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-sdk-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-client:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: "2"
      CI: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.22.2"
      - name: Prepare isolated pinned emulator and image
        shell: bash
        run: |
          set -euo pipefail
          sdk="$RUNNER_TEMP/android-sdk"
          mkdir -p "$sdk/system-images/android-34/default"
          for item in build-tools platforms platform-tools cmdline-tools licenses; do
            ln -s "$ANDROID_HOME/$item" "$sdk/$item"
          done
          curl --fail --location --retry 2 https://dl.google.com/android/repository/emulator-linux_x64-16740729.zip --output "$RUNNER_TEMP/emulator.zip"
          curl --fail --location --retry 2 https://dl.google.com/android/repository/sys-img/android/x86_64-34_r04.zip --output "$RUNNER_TEMP/image.zip"
          echo "f41f9e31eb5ca64926603c03265c50bbc0ff4172  $RUNNER_TEMP/emulator.zip" | sha1sum --check --strict
          echo "5f6a249f9bc3b1b4c459b13ce2eb646c9680bed1  $RUNNER_TEMP/image.zip" | sha1sum --check --strict
          unzip -q "$RUNNER_TEMP/emulator.zip" -d "$sdk"
          unzip -q "$RUNNER_TEMP/image.zip" -d "$sdk/system-images/android-34/default"
          test -d "$sdk/platforms/android-36"
          test -d "$sdk/build-tools/35.0.0"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          sudo chmod a+rw /dev/kvm
      - name: Build same-checkout fireemu
        run: cargo build --locked -p fireemu
      - name: Guard tests and instrumented APK
        id: build
        working-directory: tools/sdk-smoke-android
        run: |
          ./gradle.sh testDebugUnitTest --tests dev.fireemu.smoke.GuardTest --tests dev.fireemu.smoke.CaseReportTest assembleDebugAndroidTest
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Official emulator comparison
        id: official
        continue-on-error: true
        working-directory: tools/sdk-smoke-android
        run: python3 run.py run --sdk "$ANDROID_HOME" --arch x86_64 --backend official
      - name: Fireemu client smoke
        id: fireemu
        if: always() && steps.build.outcome == 'success'
        continue-on-error: true
        working-directory: tools/sdk-smoke-android
        run: python3 run.py run --sdk "$ANDROID_HOME" --arch x86_64 --backend fireemu --fireemu ../../target/debug/fireemu
      - name: Sanitized case results only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-sdk-case-results
          path: tools/sdk-smoke-android/reports/*.json
          if-no-files-found: warn
          retention-days: 7
      - name: Require both complete runs
        if: always()
        env:
          OFFICIAL: ${{ steps.official.outcome }}
          FIREEMU: ${{ steps.fireemu.outcome }}
        run: test "$OFFICIAL" = success && test "$FIREEMU" = success
