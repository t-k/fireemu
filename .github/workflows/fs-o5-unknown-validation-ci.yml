name: fs-o5-unknown-validation-ci
on:
  push:
    branches: [work/fs-o5-unknown-validation-ci]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: a900eaa0555471407bd0b57bcd92890fc68d16d0
          fetch-depth: 0
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177
        with:
          tool: cargo-nextest@0.9.143
      - run: |
          test "$(git rev-parse HEAD)" = a900eaa0555471407bd0b57bcd92890fc68d16d0
          cargo nextest run -p fireemu-adapter-grpc --profile pr --locked --no-fail-fast -E 'test(the_pipeline_corpus_replays_as_production_answered) | test(o5_pins_reject_stale_and_unknown_internal_rows) | test(unknown_add_fields_precedes_later_stage_arity_on_both_transports) | test(unknown_before_stage_arity_preserves_unobserved_and_emulator_boundaries) | test(generated_unknown_function_boundaries_remain_bounded) | test(recorded_unknown_function_refusals_follow_shape_gate) | test(unknown_function_candidates_preserve_unrecorded_and_emulator_boundaries)'
