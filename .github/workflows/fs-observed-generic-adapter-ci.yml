name: fs-observed-generic-adapter-ci
on:
  push:
    branches: [work/fs-observed-generic-adapter-ci]
permissions:
  contents: read
jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 2076670b793d72ca8720ff3657b16b99a30cebb7
          fetch-depth: 0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: .ci-helper
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177
        with:
          tool: cargo-nextest@0.9.143
      - name: Verify exact source and run mutations
        run: |
          test "$(git rev-parse HEAD)" = 2076670b793d72ca8720ff3657b16b99a30cebb7
          test "$(git -C .ci-helper rev-parse HEAD)" = "$GITHUB_SHA"
          python3 .ci-helper/.github/temporary/generic_mutations.py
      - name: Preserve mutation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: generic-adapter-mutations
          path: /tmp/generic-mutants/
          if-no-files-found: warn
