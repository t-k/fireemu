name: fs-strict-arity-lint
on:
  push:
    branches: [work/fs-strict-arity-lint-ci]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 74d326432b443af2557a11fb22195218ce460285
      - run: |
          test "$(git rev-parse HEAD)" = 74d326432b443af2557a11fb22195218ce460285
          cargo fmt --all -- --check
          cargo clippy -p fireemu-core-firestore -p fireemu-adapter-grpc --all-targets --all-features --locked -- -D warnings
