name: fs-numeric-positive-adapter-ci
on:
  push:
    branches: [work/fs-numeric-positive-adapter-ci]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ce7e5939dfa6807e1673261e03d0beb8aef83126
          fetch-depth: 0
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177
        with:
          tool: cargo-nextest@0.9.143
      - run: |
          test "$(git rev-parse HEAD)" = ce7e5939dfa6807e1673261e03d0beb8aef83126
          cargo nextest run -p fireemu-adapter-grpc --profile pr --locked -E 'test(captured_numeric_scalar_expressions_preserve_integer_results)'
