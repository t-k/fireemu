name: heavy-verification

run-name: ${{ github.event_name == 'schedule' && format('heavy-verification scheduled {0}', github.event.schedule == '23 3 * * *' && 'nightly' || github.event.schedule == '41 4 * * 6' && 'weekly' || 'critical') || format('heavy-verification {0} {1}', inputs.job, inputs.tag) }}

# Heavy verification (mutation testing, the whole nextest suite, Linux measurements) on GitHub's
# standard runners instead of a developer machine. The repository is public, so they cost nothing.
#
# Three scheduled mutation runs need no one to start them:
# - nightly: the Rust diff since the last successful scheduled nightly (or 24 hours ago); a failed
#   nightly does not move the base. A new survivor in a critical file fails the run.
# - weekly: one whole package from tools/ci/mutation-weekly.txt; survivors are reported only.
# - critical: whole files from tools/ci/mutation-critical.txt; a new survivor in a critical file fails the run.
# All three can also be dispatched from a branch.
#
# Security (public repository):
# - Triggers: the three schedules above and manual dispatch. No pull_request, no pull_request_target.
# - `permissions: contents: read` and nothing else. No secrets are used anywhere, and no write token.
# - No production credentials, and no network call to Google or Firebase: the suites run against the
#   local emulators only, and the jobs fetch nothing but the repository, the pinned actions, the
#   Rust toolchain and the crates the lockfile names. The plan job also reads the public list of this
#   repository's workflow runs, unauthenticated, to find the last successful nightly.
# - Inputs are never interpolated into a script. They reach `run:` only through `env:` and are
#   validated there first (the `plan` job). A validated value is the only thing the other jobs use.
# - Every action is pinned by its full commit SHA, and every job has a timeout.
# - A dispatch refuses to run from the default branch or a tag: the Actions cache is scoped by the ref
#   the run belongs to, and the code under test must never share a cache scope with ci.yml or
#   release.yml. A scheduled run belongs to the default branch and tests only its own head, which is
#   safe because no job saves a cache (`save-if: "false"`).
#
# Use tools/ci/heavy-run.sh to dispatch it, wait, and download the artifacts.

on:
  schedule:
    # Nightly, weekly (Saturday), then critical (Monday, Wednesday and Friday). The plan job tells them apart by this text.
    - cron: "23 3 * * *"
    - cron: "41 4 * * 6"
    - cron: "17 5 * * 1,3,5"
  workflow_dispatch:
    inputs:
      job:
        description: what to run
        type: choice
        required: true
        options:
          - mutants
          - nextest
          - linux-measure
          - nightly
          - weekly
          - critical
      ref:
        description: branch name or full commit SHA to verify
        type: string
        required: true
      package:
        description: "mutants, nightly: workspace package to mutate (empty for the whole diff); weekly: the package whose line of tools/ci/mutation-weekly.txt to run (empty for this ISO week's)"
        type: string
        default: ""
      base:
        description: "mutants: ref the diff is taken against (--in-diff); nightly and weekly choose their own"
        type: string
        default: main
      shards:
        description: "mutants: number of shards, 1 to 16"
        type: string
        default: "8"
      script:
        description: "linux-measure: path of the script to run, below scripts/ or tools/"
        type: string
        default: ""
      tag:
        description: a label the dispatcher chooses, shown in the run's title so it can find its run
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  # One scheduled run at a time (a queued one waits); a dispatch is serialized per job and ref.
  group: ${{ github.event_name == 'schedule' && 'heavy-verification-scheduled' || format('heavy-verification-{0}-{1}', inputs.job, inputs.ref) }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      job: ${{ steps.validate.outputs.job }}
      mode: ${{ steps.validate.outputs.mode }}
      skip: ${{ steps.validate.outputs.skip }}
      fail_on_new_critical: ${{ steps.validate.outputs.fail_on_new_critical }}
      files: ${{ steps.validate.outputs.files }}
      regex: ${{ steps.validate.outputs.regex }}
      packages: ${{ steps.validate.outputs.packages }}
      ref: ${{ steps.validate.outputs.ref }}
      base: ${{ steps.validate.outputs.base }}
      package: ${{ steps.validate.outputs.package }}
      script: ${{ steps.validate.outputs.script }}
      shards: ${{ steps.validate.outputs.total }}
      matrix: ${{ steps.validate.outputs.matrix }}
    steps:
      - name: validate the inputs
        id: validate
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_JOB: ${{ inputs.job }}
          INPUT_REF: ${{ inputs.ref }}
          INPUT_PACKAGE: ${{ inputs.package }}
          INPUT_BASE: ${{ inputs.base }}
          INPUT_SHARDS: ${{ inputs.shards }}
          INPUT_SCRIPT: ${{ inputs.script }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # Bracket ranges follow the locale's collation under glibc (so [a-z] can match an accented
          # letter in en_US.UTF-8); every pattern below means ASCII only.
          export LC_ALL=C
          fail() { echo "::error::$1"; exit 1; }
          # The cache is scoped by the ref this run belongs to. A dispatch never runs from the default
          # branch or a tag: code under test would share a cache scope with ci.yml and release.yml.
          # A scheduled run is the default branch itself and tests only its own head.
          [[ -n $DEFAULT_BRANCH ]] || fail "cannot read the repository's default branch"
          if [[ $EVENT_NAME == schedule ]]; then
            [[ $GITHUB_REF == "refs/heads/$DEFAULT_BRANCH" ]] || fail "a scheduled run belongs to the default branch, not $GITHUB_REF"
            [[ $GITHUB_SHA =~ ^[0-9a-f]{40}$ ]] || fail "a scheduled run needs the commit it runs on"
            case "$EVENT_SCHEDULE" in
              "23 3 * * *") INPUT_JOB=nightly INPUT_SHARDS=8 ;;
              "41 4 * * 6") INPUT_JOB=weekly INPUT_SHARDS=16 ;;
              "17 5 * * 1,3,5") INPUT_JOB=critical INPUT_SHARDS=16 ;;
              *) fail "unknown schedule" ;;
            esac
            # A schedule has no inputs: it takes the head of the default branch.
            INPUT_REF=$GITHUB_SHA INPUT_BASE=$DEFAULT_BRANCH INPUT_PACKAGE="" INPUT_SCRIPT="" INPUT_TAG=""
          else
            [[ $EVENT_NAME == workflow_dispatch ]] || fail "unexpected event $EVENT_NAME"
            case "$GITHUB_REF" in
              "refs/heads/$DEFAULT_BRANCH" | refs/tags/*) fail "dispatch from the branch under test or a dedicated branch, not $GITHUB_REF" ;;
              refs/heads/*) ;;
              *) fail "dispatch from a branch of this repository" ;;
            esac
          fi
          # A branch name or a full commit SHA: no leading dash, no "..", no "//", no trailing slash,
          # and nothing that names a ref outside refs/heads (refs/..., HEAD, FETCH_HEAD).
          ref_ok() {
            local value=$1
            [[ $value =~ ^[0-9a-f]{40}$ ]] && return 0
            [[ $value =~ ^[A-Za-z0-9][A-Za-z0-9._/-]{0,199}$ ]] || return 1
            [[ $value != *..* && $value != *//* && $value != */ && $value != *.lock ]] || return 1
            [[ $value != refs/* && $value != HEAD && $value != FETCH_HEAD && $value != ORIG_HEAD ]]
          }
          case "$INPUT_JOB" in
            mutants | nextest | linux-measure | nightly | weekly | critical) ;;
            *) fail "job must be mutants, nextest, linux-measure, nightly, weekly or critical" ;;
          esac
          ref_ok "$INPUT_REF" || fail "ref must be a branch name or a full commit SHA"
          ref_ok "$INPUT_BASE" || fail "base must be a branch name or a full commit SHA"
          [[ $INPUT_SHARDS =~ ^[0-9]{1,2}$ ]] || fail "shards must be an integer"
          shards=$((10#$INPUT_SHARDS))
          (( shards >= 1 && shards <= 16 )) || fail "shards must be from 1 to 16"
          [[ $INPUT_TAG =~ ^[A-Za-z0-9._-]{0,64}$ ]] || fail "tag must be letters, digits, dot, dash and underscore"
          if [[ -n $INPUT_PACKAGE ]]; then
            [[ $INPUT_PACKAGE =~ ^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$ ]] || fail "package must be a workspace package name"
          fi
          if [[ $INPUT_JOB == linux-measure ]]; then
            [[ $INPUT_SCRIPT =~ ^(scripts|tools)/[A-Za-z0-9._/-]{1,200}$ ]] || fail "script must be a path below scripts/ or tools/"
            [[ $INPUT_SCRIPT != *..* && $INPUT_SCRIPT != *//* ]] || fail "script must be a plain path"
          elif [[ -n $INPUT_SCRIPT ]]; then
            fail "script is only for linux-measure"
          fi
          # The ref and the base must belong to this repository: a branch of it, or a commit that one of
          # its branches contains (a bare 40-hex SHA can also name a commit of a fork).
          git clone --quiet --bare --filter=blob:none "$REPO_URL" "$RUNNER_TEMP/repo.git"
          resolve() {
            local value=$1 commit
            if [[ $value =~ ^[0-9a-f]{40}$ ]]; then
              git -C "$RUNNER_TEMP/repo.git" cat-file -e "$value^{commit}" 2> /dev/null || return 1
              [[ -n $(git -C "$RUNNER_TEMP/repo.git" for-each-ref --contains "$value" refs/heads) ]] || return 1
              echo "$value"
            else
              commit=$(git -C "$RUNNER_TEMP/repo.git" rev-parse --verify --quiet "refs/heads/$value^{commit}") || return 1
              echo "$commit"
            fi
          }
          ref_sha=$(resolve "$INPUT_REF") || fail "ref is not a branch of this repository, nor a commit of one"
          base_sha=$(resolve "$INPUT_BASE") || fail "base is not a branch of this repository, nor a commit of one"
          job=$INPUT_JOB mode=$INPUT_JOB package=$INPUT_PACKAGE files="" regex="" packages="" skip=false fail_on_new_critical=false
          case "$INPUT_JOB" in
            nightly)
              # Only a successful scheduled nightly moves the base; failed, cancelled and skipped
              # runs leave it unchanged. Fall back to 24 hours ago when no usable base is found.
              job=mutants fail_on_new_critical=true
              last="" history_complete=false
              for page in {1..10}; do
                listing=$(curl --silent --show-error --fail --max-time 30 --header 'Accept: application/vnd.github+json' \
                  "https://api.github.com/repos/$REPOSITORY/actions/workflows/heavy-verification.yml/runs?event=schedule&status=completed&branch=$DEFAULT_BRANCH&per_page=100&page=$page") || fail "cannot read the run history; the base is not moved"
                last=$(python3 -c '
          import json, re, sys
          runs = json.load(sys.stdin)["workflow_runs"]
          if not isinstance(runs, list):
              raise ValueError("workflow_runs is not a list")
          for run in runs:
              if run.get("display_title") == "heavy-verification scheduled nightly" and run.get("conclusion") == "success" and re.fullmatch(r"[0-9a-f]{40}", run.get("head_sha") or ""):
                  print(run["head_sha"])
                  break
          ' <<< "$listing") || fail "cannot read the run history; the base is not moved"
                [[ -z $last ]] || break
                count=$(python3 -c 'import json, sys; print(len(json.load(sys.stdin)["workflow_runs"]))' <<< "$listing") || fail "cannot read the run history; the base is not moved"
                if (( count < 100 )); then history_complete=true; break; fi
              done
              [[ -n $last || $history_complete == true ]] || fail "cannot read the run history; the base is not moved"
              if [[ -n $last ]] && git -C "$RUNNER_TEMP/repo.git" cat-file -e "$last^{commit}" 2> /dev/null &&
                git -C "$RUNNER_TEMP/repo.git" merge-base --is-ancestor "$last" "$ref_sha"; then
                base_sha=$last
              else
                base_sha=$(git -C "$RUNNER_TEMP/repo.git" rev-list -n 1 --before="24 hours ago" "$ref_sha")
                [[ -n $base_sha ]] || base_sha=$(git -C "$RUNNER_TEMP/repo.git" rev-list --max-parents=0 "$ref_sha" | tail -n 1)
              fi
              if [[ -z $(git -C "$RUNNER_TEMP/repo.git" diff --name-only "$base_sha" "$ref_sha" -- '*.rs') ]]; then
                skip=true
              fi
              ;;
            weekly)
              # One package of the rotation, whole. The list is read from the commit under test.
              job=mutants base_sha=""
              week=$((10#$(date -u +%V)))
              mapfile -t entries < <(git -C "$RUNNER_TEMP/repo.git" show "$ref_sha:tools/ci/mutation-weekly.txt" | sed -e 's/[[:space:]]*#.*$//' -e '/^[[:space:]]*$/d')
              (( ${#entries[@]} > 0 )) || fail "tools/ci/mutation-weekly.txt lists no package"
              if [[ -n $INPUT_PACKAGE ]]; then
                entry=""
                for candidate in "${entries[@]}"; do
                  if [[ ${candidate%% *} == "$INPUT_PACKAGE" ]]; then
                    entry=$candidate
                    break
                  fi
                done
                [[ -n $entry ]] || fail "package $INPUT_PACKAGE is not in tools/ci/mutation-weekly.txt"
              else
                entry=${entries[$((week % ${#entries[@]}))]}
              fi
              read -r -a tokens <<< "$entry"
              package=${tokens[0]}
              [[ $package =~ ^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$ ]] || fail "the rotation names a bad package"
              selection=()
              for token in "${tokens[@]:1}"; do
                [[ $token =~ ^!?[A-Za-z0-9_./*-]{1,200}$ && $token != *..* && $token != *//* ]] || fail "the rotation names a bad file"
                files="$files $token"
                selection+=("$token")
              done
              files=${files# }
              # The line's files, selected by name within its package (--file did not filter; see
              # tools/ci/rotation-selection.py). The package's files come from the commit under test.
              git -C "$RUNNER_TEMP/repo.git" show "$ref_sha:tools/ci/rotation-selection.py" > "$RUNNER_TEMP/rotation-selection.py"
              git -C "$RUNNER_TEMP/repo.git" ls-tree -r --name-only "$ref_sha" -- "crates/$package" > "$RUNNER_TEMP/package-files.txt"
              regex=$(python3 "$RUNNER_TEMP/rotation-selection.py" "$package" "${selection[@]}" < "$RUNNER_TEMP/package-files.txt") || fail "the rotation line selects no file of $package"
              [[ -n $regex && $regex != *[[:space:]]* ]] || fail "the rotation selection must be one regex without spaces"
              ;;
            critical)
              # The list and the helper that turns it into one regex come from the commit under test. The
              # regex has no spaces and goes to cargo mutants --re; no other value of the list reaches a command.
              job=mutants base_sha="" package="" fail_on_new_critical=true
              git -C "$RUNNER_TEMP/repo.git" show "$ref_sha:tools/ci/critical-selection.py" > "$RUNNER_TEMP/critical-selection.py"
              git -C "$RUNNER_TEMP/repo.git" show "$ref_sha:tools/ci/mutation-critical.txt" > "$RUNNER_TEMP/mutation-critical.txt"
              regex=$(python3 "$RUNNER_TEMP/critical-selection.py" --regex "$RUNNER_TEMP/mutation-critical.txt") || fail "tools/ci/mutation-critical.txt is not a valid list"
              [[ -n $regex && $regex != *[[:space:]]* ]] || fail "the critical selection must be one regex without spaces"
              packages=$(python3 "$RUNNER_TEMP/critical-selection.py" --packages "$RUNNER_TEMP/mutation-critical.txt") || fail "tools/ci/mutation-critical.txt names no package"
              [[ $packages =~ ^[a-z0-9][a-z0-9-]{0,63}( [a-z0-9][a-z0-9-]{0,63})*$ ]] || fail "the critical list names a bad package"
              ;;
          esac
          matrix=$(seq 0 $((shards - 1)) | paste -sd, -)
          {
            echo "job=$job"
            echo "mode=$mode"
            echo "skip=$skip"
            echo "fail_on_new_critical=$fail_on_new_critical"
            echo "regex=$regex"
            echo "packages=$packages"
            echo "files=$files"
            echo "ref=$ref_sha"
            echo "base=$base_sha"
            echo "package=$package"
            echo "script=$INPUT_SCRIPT"
            echo "total=$shards"
            echo "matrix=[$matrix]"
          } >> "$GITHUB_OUTPUT"

  mutants:
    needs: plan
    if: needs.plan.outputs.job == 'mutants' && needs.plan.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      count: ${{ steps.select.outputs.count }}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.plan.outputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.94.0
      - name: the pinned toolchain is the one in use
        run: rustc --version | tee /dev/stderr | grep -q "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
      - uses: taiki-e/install-action@7b8d4719ee4aaa279bdf55df38dacb9ebfe12a6c
        with:
          tool: cargo-mutants@27.1.0,cargo-nextest@0.9.143
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: heavy-mutants
          save-if: "false"
      # The unmutated baseline runs the whole suite of the mutated package, including the suites that run
      # the real SDKs and the offline authority checks (run 41476822938 failed its baseline without them):
      # the same preparation as the nextest job.
      - name: fetch locked dependency graph for offline authority checks
        run: cargo fetch --locked
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: the pinned real SDKs for the suites that run them
        run: pnpm -C conformance install --frozen-lockfile
      # What is mutated: the Rust diff against the base (a dispatch, the nightly), or one package of the
      # rotation, whole or by file (the weekly). Counted first, so that a diff without a mutant (a test-only
      # change) ends here instead of leaving a run with no result for the summary to refuse.
      # The critical list is checked against this tree (paths exist, scoped functions are defined), so a stale
      # entry fails the run before any shard starts.
      - name: check the critical list against the tree
        if: needs.plan.outputs.mode == 'critical'
        run: python3 tools/ci/critical-selection.py --check tools/ci/mutation-critical.txt .
      - name: select the mutants
        id: select
        env:
          MODE: ${{ needs.plan.outputs.mode }}
          BASE: ${{ needs.plan.outputs.base }}
          PACKAGE: ${{ needs.plan.outputs.package }}
          FILES: ${{ needs.plan.outputs.files }}
          REGEX: ${{ needs.plan.outputs.regex }}
          PACKAGES: ${{ needs.plan.outputs.packages }}
        run: |
          set -euo pipefail
          args=()
          if [[ $MODE == critical ]]; then
            # Selected by name and by package: --file did not filter in a measurement, and --re filters only
            # within the packages given with -p (see tools/ci/critical-selection.py).
            for package in $PACKAGES; do args+=(-p "$package"); done
            args+=(--re "$REGEX")
          elif [[ $MODE == weekly ]]; then
            # The line's files by name within its package (see tools/ci/rotation-selection.py).
            args+=(-p "$PACKAGE" --re "$REGEX")
          else
            git fetch --no-tags origin "$BASE"
            git diff -U0 FETCH_HEAD...HEAD > "$RUNNER_TEMP/changes.diff"
            args+=(--in-diff "$RUNNER_TEMP/changes.diff")
            if [[ -n $PACKAGE ]]; then
              args+=(-p "$PACKAGE")
            fi
          fi
          printf '%s\n' "${args[@]}" > "$RUNNER_TEMP/mutants.args"
          listing=$(cargo mutants "${args[@]}" --list)
          count=$(grep -c . <<< "$listing" || true)
          echo "$count mutants selected"
          echo "count=$count" >> "$GITHUB_OUTPUT"
      - name: mutate this shard
        if: steps.select.outputs.count != '0'
        env:
          SHARD: ${{ matrix.shard }}
          TOTAL: ${{ needs.plan.outputs.shards }}
        run: |
          set -euo pipefail
          mapfile -t args < "$RUNNER_TEMP/mutants.args"
          set +e
          # The copy of the tree under test keeps what the suites load: the ignored conformance/node_modules
          # (--gitignore=false) and the git history the build-report tests read (--copy-vcs=true).
          cargo mutants --gitignore=false --copy-vcs=true --test-tool nextest --cargo-arg=--locked "${args[@]}" \
            --shard "$SHARD/$TOTAL" --sharding slice --output "mutants-out-$SHARD"
          code=$?
          set -e
          # 0: every mutant caught. 2: some missed. 3: some timed out. The summary job reports
          # those; any other status (a usage error, a failing baseline) fails this shard.
          case $code in
            0 | 2 | 3) exit 0 ;;
            *) exit "$code" ;;
          esac
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mutants-shard-${{ matrix.shard }}
          path: mutants-out-${{ matrix.shard }}/mutants.out
          if-no-files-found: warn

  mutants-summary:
    needs: [plan, mutants]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.job == 'mutants' && needs.plan.outputs.skip != 'true' && needs.mutants.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The workflow's own commit: the merge script is not taken from the verified ref.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: mutants-shard-*
          path: shards
      - name: merge the shards
        env:
          TOTAL: ${{ needs.plan.outputs.shards }}
          MUTANTS_RESULT: ${{ needs.mutants.result }}
          FAIL_ON_NEW_CRITICAL: ${{ needs.plan.outputs.fail_on_new_critical }}
        run: |
          set -euo pipefail
          mkdir summary
          code=0
          # Nightly and critical runs fail on new critical survivors; other runs only report them.
          extra=()
          if [[ $FAIL_ON_NEW_CRITICAL == true ]]; then extra+=(--fail-on-new-critical); fi
          python3 tools/ci/mutants-summary.py --survivors tools/ci/mutation-survivors.txt --critical tools/ci/mutation-critical.txt --expected-shards "$TOTAL" --mutants-result "$MUTANTS_RESULT" "${extra[@]}" shards summary || code=$?
          # The summary is shown and uploaded whether or not the run can be trusted; the step still fails with the script's status.
          if [[ -f summary/summary.md ]]; then
            cat summary/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$code"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mutants-summary
          path: summary
          if-no-files-found: error
          # A shard (untrusted code) may have created an artifact of this name before this job
          # runs: this job's upload replaces it.
          overwrite: true

  nextest:
    needs: plan
    if: needs.plan.outputs.job == 'nextest'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.plan.outputs.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.94.0
      - name: the pinned toolchain is the one in use
        run: rustc --version | tee /dev/stderr | grep -q "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
      - uses: taiki-e/install-action@7b8d4719ee4aaa279bdf55df38dacb9ebfe12a6c
        with:
          tool: cargo-nextest@0.9.143
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: heavy-nextest-${{ matrix.os }}
          save-if: "false"
      # Cargo authority resolves the locked Linux projection with `--offline`. A host build does not
      # populate another target's registry sources, so fetch the whole locked graph first (as ci.yml does).
      - name: fetch locked dependency graph for offline authority checks
        run: cargo fetch --locked
      # Suites that run the real SDKs (the Functions runtime, eventarc_authentication) load them from
      # the pinned conformance install, as the ci.yml and release.yml test jobs do. No pnpm cache.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: the pinned real SDKs for the suites that run them
        run: pnpm -C conformance install --frozen-lockfile
      - name: the whole suite (profile pr)
        run: cargo nextest run --workspace --profile pr --locked

  linux-measure:
    needs: plan
    if: needs.plan.outputs.job == 'linux-measure'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.plan.outputs.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.94.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: heavy-measure
          save-if: "false"
      - name: run the script
        env:
          SCRIPT: ${{ needs.plan.outputs.script }}
          HEAVY_OUT: ${{ runner.temp }}/heavy-out
        run: |
          set -euo pipefail
          [[ -f $SCRIPT ]] || { echo "::error::$SCRIPT is not a file of the ref"; exit 1; }
          mkdir -p "$HEAVY_OUT"
          # The script writes everything it wants kept below $HEAVY_OUT.
          bash "$SCRIPT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: linux-measure-output
          path: ${{ runner.temp }}/heavy-out
          if-no-files-found: warn
