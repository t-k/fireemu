name: FS missing alias source-bound binary
on:
  push:
    branches: [work/fs-missing-quint-ci]
permissions:
  contents: read
jobs:
  binary:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      RUSTC_WRAPPER: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Select exact candidate source
        run: |
          set -euo pipefail
          git checkout --detach e5eac5ae35520fd163c112118d3b33c3448937d9
          test "$(git rev-parse HEAD)" = e5eac5ae35520fd163c112118d3b33c3448937d9
          test -z "$(git status --porcelain)"
          test ! -e target
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      - name: Build source-bound debug binary
        run: |
          set -euo pipefail
          cargo build --manifest-path "$GITHUB_WORKSPACE/Cargo.toml" --locked -p fireemu --bin fireemu 2>&1 | tee "$RUNNER_TEMP/build.log"
          test -z "$(git status --porcelain)"
          mkdir "$RUNNER_TEMP/fs-binary"
          cp target/debug/fireemu target/debug/fireemu.d "$RUNNER_TEMP/fs-binary/"
          cp "$RUNNER_TEMP/build.log" "$RUNNER_TEMP/fs-binary/"
          git rev-parse HEAD > "$RUNNER_TEMP/fs-binary/source-commit.txt"
          (cd "$RUNNER_TEMP/fs-binary" && sha256sum fireemu fireemu.d build.log source-commit.txt > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fs-missing-alias-linux-arm64
          path: ${{ runner.temp }}/fs-binary
          if-no-files-found: error
