name: FS empty constructors targeted
on:
  push:
    branches: [work/fs-empty-constructors-ci]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      - name: Targeted test
        run: cargo test --locked -p fireemu-adapter-grpc --test pipeline_strict_recorded recorded_empty_constructors_and_unobserved_options -- --nocapture
