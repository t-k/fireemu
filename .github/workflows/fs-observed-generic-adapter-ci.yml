name: fs-observed-generic-adapter-ci
on:
  push:
    branches: [work/fs-observed-generic-adapter-ci]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: cc2720663e36f7bb01f72a402910923ef8830a9f
          fetch-depth: 0
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177
        with:
          tool: cargo-nextest@0.9.143
      - run: |
          test "$(git rev-parse HEAD)" = cc2720663e36f7bb01f72a402910923ef8830a9f
          cargo nextest run -p fireemu-adapter-grpc --profile pr --locked --no-fail-fast -E 'test(captured_generic_expressions_preserve_typed_results) | test(coalesce_skips_failing_constant_but_validates_static_errors)'
