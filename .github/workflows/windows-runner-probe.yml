name: windows-runner-probe

# Temporary: a fast Windows loop for the bundled Functions runner while
# work/windows-runner is open. Remove this file before the branch merges.
on:
  push:
    branches: [work/windows-runner]

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.143
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-runner-probe
          save-if: "false"
      - name: node version
        shell: bash
        run: node --version; where node
      - name: runner tests
        shell: bash
        run: cargo nextest run -p fireemu-adapter-functions --lib --profile pr --no-fail-fast -E 'test(/runner::/)' --no-capture
