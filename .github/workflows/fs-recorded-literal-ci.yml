name: fs-recorded-literal-ci
on:
  push:
    branches: [work/fs-recorded-literal-ci]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 255a52a3302ecdf1e466848ff3e3d714938b7bec
          fetch-depth: 0
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177
        with:
          tool: cargo-nextest@0.9.143
      - run: |
          test "$(git rev-parse HEAD)" = 255a52a3302ecdf1e466848ff3e3d714938b7bec
          cargo nextest run -p fireemu-adapter-grpc --profile pr --locked -E 'test(recorded_literal_refusal_gate_matrix)'
