name: offline-compat-source-export

on:
  push:
    branches: [work/offline-compat-20260919]
    paths: [.github/workflows/offline-compat-export.yml]

permissions:
  contents: read

jobs:
  source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Download pinned validation wheels only
        run: |
          set -eu
          python -m pip download --no-deps --only-binary=:all: --dest "$RUNNER_TEMP/wheels" ruff==0.12.12 pytest-timeout==2.4.0
          cd "$RUNNER_TEMP/wheels"
          sha256sum *.whl > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: fireemu-offline-tools
          path: ${{ runner.temp }}/wheels
          retention-days: 1
          if-no-files-found: error
