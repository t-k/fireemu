name: v040 temporary validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  r21-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: e16aa5644c9e409f3e6976811a4745bca41f40e3
      - run: test "$(git rev-parse HEAD)" = e16aa5644c9e409f3e6976811a4745bca41f40e3
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.32.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: pnpm -C conformance install --frozen-lockfile
      - run: node --test --test-name-pattern='R21 v0.3[89]|R21 v0.40' conformance/src/release-strict-regression.test.mjs
