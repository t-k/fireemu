name: ci

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Spec 31.1 pull-request gate. Retries are never used (ADR-006).
  pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the compiler; the action only makes sure rustup is present.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: the pinned toolchain is the one in use
        run: rustc --version | tee /dev/stderr | grep -q "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-deny
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: docs
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: cargo deny
        run: cargo deny check
      - name: core crates have zero external normal dependencies
        run: scripts/check-core-deps.sh
      - name: tests (profile pr, retries 0)
        run: cargo nextest run --workspace --profile pr
      - name: limit catalog matches generated constants
        run: cargo run -p limit-catalog-gen -- check
      - name: requirement / mutant / loom traceability
        run: cargo run -p traceability-check
      - name: compatibility contract, manifest and public claim
        run: cargo run -p compat-check
      - name: canonical config schema and examples
        run: cargo run -p config-schema-check
      - name: generated protobuf code matches vendored protos
        run: |
          sudo apt-get install -y protobuf-compiler
          cargo run -p proto-gen -- check
      - name: loom scenarios
        run: cargo test -p fireemu-verification-loom --release
        env:
          RUSTFLAGS: --cfg loom -D warnings

  # The platforms fireemu publishes binaries for, so a change that only breaks one of them is
  # caught before a tag is cut rather than during a release. The Ubuntu `pr` job above stays
  # the full gate -- formatting, lints, docs, licences, traceability, generated code, loom --
  # and these two run the tests only, which keeps the matrix cheap.
  #
  # Linux arm64 is not here: it shares this source with linux x64 and is exercised in the
  # release workflow, which builds and tests it on a native arm64 runner.
  platforms:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
      # The process-census integration suites shell out to `ps` and `kill` to prove that a
      # daemon leaves nothing running; they are POSIX-only by construction, so Windows runs the
      # in-crate unit tests. Making them portable is tracked in the distribution issue.
      - name: tests
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            cargo nextest run --workspace --lib --profile pr
          else
            cargo nextest run --workspace --profile pr
          fi

  # The packages a release would publish, built from this commit and installed the way a user
  # installs them: offline, from the packed tarballs, under a path with a space and non-ASCII
  # characters, through a symlink and from a read-only directory. `pack-local.mjs` is what a
  # developer runs before a tag; running it here keeps the packaging from rotting between tags.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - uses: Swatinem/rust-cache@v2
        with:
          key: package
      - run: pnpm -C ui install --frozen-lockfile
      - run: pnpm -C ui build
      - run: node --test npm/scripts/distribution-licenses.test.mjs
      - run: cargo build --release --locked -p fireemu
      - run: node npm/scripts/pack-local.mjs
      - run: node npm/scripts/verify-install.mjs --dist npm/dist

  # Emulator UI gate (UI-PARITY-05): unit tests, lint, format, the adapter-ui browser-policy
  # tests, and the Playwright E2E (parity flows plus the security suite -- CSP, DNS-rebinding
  # via Host/Origin, download disposition, and bounded reads) against a real daemon.
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "10.32.1"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: install UI dependencies
        run: pnpm -C ui install --frozen-lockfile
      - name: lint
        run: pnpm -C ui lint
      - name: format
        run: pnpm -C ui fmt:check
      - name: unit tests
        run: pnpm -C ui test
      - name: build the UI bundle
        run: pnpm -C ui build
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: Swatinem/rust-cache@v2
        with:
          key: ui
      - name: adapter-ui tests (browser policy, streams, downloads)
        run: cargo nextest run -p fireemu-adapter-ui
      - name: build the daemon with the UI embedded
        run: cargo build --release -p fireemu
      - name: install the Playwright browser
        run: pnpm -C ui exec playwright install --with-deps chromium
      - name: browser E2E (parity flows and the security suite)
        run: pnpm -C ui e2e

  quint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: verify pinned Rust toolchain
        run: rustc --version | tee /dev/stderr | grep -q "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
      - uses: pnpm/action-setup@v4
        with:
          version: "10.32.1"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: verification/quint/pnpm-lock.yaml
      - name: install pinned Quint
        run: pnpm -C verification/quint install --frozen-lockfile
      - name: install verified Apalache backend
        run: |
          quint_home="$RUNNER_TEMP/quint-home"
          QUINT_HOME="$quint_home" verification/quint/bin/install-apalache
          echo "QUINT_HOME=$quint_home" >> "$GITHUB_ENV"
      - name: configure guarded Quint path
        run: |
          echo "QUINT_REAL_BIN=$GITHUB_WORKSPACE/verification/quint/node_modules/.bin/quint" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/verification/quint/bin" >> "$GITHUB_PATH"
      - name: normal Quint crate tests
        run: cargo test -p fireemu-verification-quint
      - name: complete Quint authority pass without retry
        env:
          VERIFICATION_PASSES: "1"
        run: verification/quint/run-verification.sh
      - name: fail on leaked owned checker processes
        if: always()
        shell: bash
        run: |
          ps -eo pid=,comm=,args= | awk \
            -v root="$GITHUB_WORKSPACE/verification/quint" \
            -v quint="$GITHUB_WORKSPACE/verification/quint/node_modules/.bin/quint" '
            {
              pid = $1
              comm = $2
              $1 = $2 = ""
              args = $0
            }
            (comm ~ /^node/ && index(args, root)) ||
            (comm == "timeout" && index(args, quint)) ||
            (comm ~ /^java/ && (args ~ /tlc2\.TLC/ || args ~ /[Aa]palache/)) {
              print pid, comm, args
              leaked = 1
            }
            END { exit leaked }
          '
