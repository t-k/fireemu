name: fs-strict-arity-ci
on:
  push:
    branches: [work/fs-strict-arity-ci]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: f15259175aac7ce7235542eb7e2eb1d816dca298
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177
        with:
          tool: cargo-nextest@0.9.143
      - run: |
          test "$(git rev-parse HEAD)" = f15259175aac7ce7235542eb7e2eb1d816dca298
          cargo nextest run -p fireemu-core-firestore -p fireemu-adapter-grpc --profile pr --locked -E 'test(recorded_arity_metadata_formats_document_and_comparison_signatures) | test(generated_comparison_arity_and_precedence_cases)'
