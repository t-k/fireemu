name: fs-o5-unknown-validation-ci
on:
  push:
    branches: [work/fs-o5-unknown-validation-ci]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 8d267a53dcd7215ce2b64a03507aacdad7b24a4f
          fetch-depth: 0
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177
        with:
          tool: cargo-nextest@0.9.143
      - run: |
          test "$(git rev-parse HEAD)" = 8d267a53dcd7215ce2b64a03507aacdad7b24a4f
          cargo nextest run -p fireemu-adapter-grpc --profile pr --locked --no-fail-fast -E 'test(the_pipeline_corpus_replays_as_production_answered) | test(o5_and_duplicate_internal_pins_reject_unobserved_matches) | test(recorded_unknown_refusals_match_both_profiles_and_transports) | test(unrecorded_unknown_candidates_keep_original_refusal_bodies) | test(unknown_before_stage_arity_preserves_unobserved_and_emulator_boundaries) | test(unknown_candidate_gate_preserves_exact_fallback_status) | test(generated_unknown_function_boundaries_remain_bounded)'
