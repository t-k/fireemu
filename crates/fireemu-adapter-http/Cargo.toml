[package]
name = "fireemu-adapter-http"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "HTTP shell: Identity Toolkit (Firebase Auth) REST subset over hyper"

[dependencies]
fireemu-adapter-support = { path = "../fireemu-adapter-support" }
fireemu-core-types = { path = "../fireemu-core-types" }
fireemu-core-auth = { path = "../fireemu-core-auth" }
fireemu-core-app-check = { path = "../fireemu-core-app-check" }
fireemu-core-session = { path = "../fireemu-core-session" }
fireemu-core-limits = { path = "../fireemu-core-limits" }
fireemu-core-rules = { path = "../fireemu-core-rules" }
fireemu-core-storage = { path = "../fireemu-core-storage" }
fireemu-core-firestore = { path = "../fireemu-core-firestore" }
fireemu-core-functions = { path = "../fireemu-core-functions" }
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "sync", "io-util"] }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
rsa = "0.9"
sha2 = { version = "0.10", features = ["oid"] }
rand_chacha = "0.3"
rand_core = "0.6"
subtle = "2"

[lints]
workspace = true
